/* Layout: one-column phone app with HUD panels (corner brackets, glass), bottom tab bar, full-screen training overlays.
   Look: arc-reactor cyan for interface light, suit red-to-gold for the main action, bumper-plate colors as data colors. */
:root{
  --p25:#e0322b; --p20:#2f6be0; --p15:#f2bd2c; --p10:#2fb36a; --p5:#e8eef2; --p2:#7f95a3;
  --display:"Rajdhani","Arial Narrow",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

/* design picker */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overscroll-behavior:none;
  background:radial-gradient(900px 520px at 0% -8%,rgba(var(--ac),.09),transparent 62%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:var(--fx-img);background-size:var(--fx-size);
  -webkit-mask-image:var(--fx-mask);mask-image:var(--fx-mask)}
#fxl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
h1,h2,h3{font-family:var(--head);font-weight:var(--hw);letter-spacing:var(--hls);margin:0;text-wrap:balance;line-height:1.02;text-transform:var(--htt)}
h1{text-shadow:none}
.num{font-family:var(--hud);font-weight:var(--numw);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.label{font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--label);font-weight:600}
.muted{color:var(--muted)}
#app{display:flex;flex-direction:column;min-height:100%;position:relative;z-index:1}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 18px) 110px;max-width:640px;width:100%;margin:0 auto}
section{display:flex;flex-direction:column;gap:16px}

/* HUD panel with corner brackets */
.card,.stage,.stepper,.libitem,.histitem,details.tip,.empty,.hint{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 0 28px rgba(var(--ac),.035)}
.card::before,.stage::before,.stepper::before,.libitem::before,.histitem::before,details.tip::before{content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:var(--r);opacity:var(--brk);
  background:linear-gradient(var(--arc),var(--arc)) top left/14px 2px no-repeat,linear-gradient(var(--arc),var(--arc)) top left/2px 14px no-repeat,
  linear-gradient(var(--arc),var(--arc)) bottom right/14px 2px no-repeat,linear-gradient(var(--arc),var(--arc)) bottom right/2px 14px no-repeat}
.card{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbg);backdrop-filter:blur(12px);border-top:1px solid var(--line2);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--arc)}
.tabs button[aria-current="page"] svg{filter:drop-shadow(0 0 6px var(--arc))}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:2px;background:var(--arc);box-shadow:0 0 10px var(--arc)}

.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--rb);padding:12px 16px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;background:rgba(var(--ac),.07);border:1px solid var(--line2);min-height:48px;color:var(--fg)}
.btn.primary{position:relative;border:0;border-radius:var(--rbp);color:var(--btn-ink);font-size:20px;letter-spacing:.18em;
  background:linear-gradient(180deg,var(--btn1),var(--btn2));
  clip-path:var(--clip)}
.btn.primary::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 45%);pointer-events:none}
.btn:disabled{opacity:.35;filter:grayscale(.6);cursor:not-allowed}
[data-theme="day"] .btn.primary:disabled{opacity:1;filter:none;background:#d3dbe3;color:#4a5d6b;box-shadow:inset 0 0 0 1px rgba(20,50,75,.22)}
[data-theme="day"] .btn.primary:disabled::after{display:none}
#onb{z-index:50}
#onb:not([hidden])~#sheetBg{z-index:55}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:7px 12px;font-size:13px;letter-spacing:.1em}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--rs);padding:5px 12px;border:1px solid var(--line2);font-family:var(--hud);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--accent-ink);border-color:var(--fg)}
.hello h1{font-size:36px}
.plan-letter{font-family:var(--hud);font-weight:800;font-size:58px;line-height:.85;color:var(--fg);text-shadow:0 0 18px rgba(var(--ac),.35)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.exlist li:first-child{border-top:0}
.exlist li>span:first-child::before{content:"";display:inline-block;width:5px;height:5px;background:var(--arc);margin-right:10px;vertical-align:middle;transform:rotate(45deg);opacity:.7}
.sr{font-family:var(--hud);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:.08em}
.week i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:13px}
.week i.on{background:var(--arc);border-color:var(--arc);color:var(--accent-ink)}
.week i.today{border-color:var(--fg)}
.libitem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:8px;text-align:left;width:100%}
.libitem canvas{width:72px;height:72px;background:radial-gradient(circle at 50% 70%,rgba(var(--ac),.14),transparent 70%),var(--mini);border-radius:var(--rs);border:1px solid var(--line)}
.libitem b{display:block;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.libitem small{color:var(--muted)}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:3px 8px;border-radius:var(--rs);border:1px solid var(--line2);color:var(--label)}
details.tip{padding:0 16px}
details.tip summary{list-style:none;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";font-family:var(--hud);font-size:20px;color:var(--arc)}
details.tip[open] summary::after{content:"–"}
details.tip>div{padding-bottom:16px;color:var(--muted);max-width:62ch}
details.tip div p{margin:0 0 8px}
details.tip strong{color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px}
select,input[type=number],input[type=text],textarea{background:rgba(var(--ac),.05);color:var(--fg);border:1px solid var(--line2);border-radius:var(--rb);padding:10px 12px;font:inherit;width:100%}
select option{background:var(--opt)}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--rb);padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:calc(var(--rb)*.6);font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--accent-ink)}
.platecount{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.platecount label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;overflow-y:auto;
  background:radial-gradient(700px 420px at 50% -10%,rgba(var(--ac),.09),transparent 65%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.overlay>.inner{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:var(--rb);border:1px solid var(--line2);background:rgba(var(--ac),.05);display:grid;place-items:center;color:var(--arc);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.progress{height:3px;background:rgba(var(--ac),.12);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--arc2),var(--arc));box-shadow:0 0 10px var(--arc);transition:width .4s}
.stage{overflow:hidden;background:radial-gradient(ellipse at 50% 88%,rgba(var(--ac),.16),transparent 60%),linear-gradient(rgba(var(--ac),.05) 1px,transparent 1px) 0 0/100% 22px,var(--stage)}
.stage canvas{display:block;width:100%;height:250px;position:relative}
.stage .phase{position:absolute;left:14px;top:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--arc);text-shadow:0 0 10px rgba(var(--ac),.6);z-index:1}
.stage .phase:not(:empty)::before{content:"▸ "}
.stage .tempo{position:absolute;right:14px;top:12px;font-family:var(--hud);font-size:10.5px;letter-spacing:.08em;color:var(--muted);z-index:1}
.stage .readout{position:absolute;left:14px;bottom:9px;font-family:var(--hud);font-size:9.5px;letter-spacing:.14em;color:var(--faint);z-index:1}
.exname{font-size:34px}
.setchips{display:flex;gap:8px;flex-wrap:wrap}
.setchip{min-width:66px;padding:7px 10px;border-radius:var(--rs);border:1px solid var(--line);background:rgba(var(--ac),.03);text-align:center;font-family:var(--hud);font-size:13px;font-weight:600;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.setchip small{display:block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.setchip.done{background:rgba(var(--ac),.12);border-color:rgba(var(--ac),.6);color:var(--fg)}
.setchip.cur{border-color:var(--fg);color:var(--fg)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper .ctl{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:100%}
.stepper .ctl button{height:44px;border-radius:var(--rs);border:1px solid var(--line2);color:var(--arc);font-size:24px;font-family:var(--display);font-weight:700}
.stepper .val{font-family:var(--hud);font-weight:700;font-size:30px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.hint{font-size:13.5px;color:var(--muted);padding:10px 12px;border-left:2px solid var(--arc)}
.hint b{color:var(--fg)}
.hint.up{border-left-color:var(--fg);background:linear-gradient(90deg,rgba(var(--ac),.08),var(--panel) 60%)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cues li::marker{color:var(--arc);font-family:var(--hud);font-size:12px}
.cues.bad li::marker{content:"✕  ";color:var(--bad)}

/* rest: arc reactor */
.restwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.ring::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(var(--ac),.22),rgba(var(--ac),.04) 60%,transparent 72%)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}

  if(isT){/* holds and timed sets progress in seconds, never in kg */
    if(hard2)return{...base,mode:"down",dr:-5,why:`<b>−5 s</b>, weil zweimal hart und Ziel verfehlt. Sauber halten, dann neu aufbauen.`};
    if(eff==="hard"||missed)return{...base,mode:"hold",dr:0,why:`Zeit halten${eff==="hard"?", weil letzte Einheit hart":", Ziel letztes Mal verfehlt"} (${reps}). Ruhig atmen, Spannung halten.`};
    if(allTop&&eff==="easy")return{...base,mode:"up2",up:true,dr:10,why:`<b>+10 s</b>, weil letzte Einheit leicht und alle Sätze mit ${item.hi} s geschafft.`};
    if(allTop)return{...base,mode:"up",up:true,dr:5,why:`Letztes Mal alle Sätze mit ${item.hi} s geschafft. Heute <b>+5 s</b> pro Satz.`};
    if(nearTop&&eff==="easy")return{...base,mode:"early",up:true,dr:5,why:`<b>+5 s</b>, weil letzte Einheit leicht. Früher steigern.`};
    return{...base,mode:"hold",dr:0,why:`Gleiche Zeit wie letztes Mal. Ziel: <b>länger halten</b> als ${reps}.`}}
  if(hard2&&w>0&&e.inc>0)return{...base,mode:"down",why:`weil zweimal hart und Ziel verfehlt (${reps}). Etwas leichter und neu aufbauen.`};
  if(eff==="hard"&&allTop)return{...base,mode:"hold",why:`Alle Sätze geschafft, aber hart: <b>Gewicht halten</b> und festigen.`};
  if(eff==="hard"||missed)return{...base,mode:"hold",why:`<b>Gewicht halten</b>, ${eff==="hard"?"weil letzte Einheit hart":"Ziel letztes Mal verfehlt"} (${reps}). Ziel: mehr saubere Wiederholungen.`};
  if(allTop&&e.inc>0)return{...base,mode:eff==="easy"?"up2":"up",up:true,why:eff==="easy"?`weil letzte Einheit leicht und alle Sätze mit ${item.hi} geschafft. Größerer Schritt.`:`Letztes Mal alle Sätze mit ${item.hi} geschafft.`};
  if(allTop)return{...base,mode:"top",up:true,why:`Letztes Mal alles geschafft${eff==="easy"?" und leicht":""}. Nimm ein stärkeres Band oder mach die Bewegung langsamer.`};
  if(nearTop&&eff==="easy"&&e.inc>0)return{...base,mode:"early",up:true,why:`weil letzte Einheit leicht und fast alle Wiederholungen geschafft. Früher steigern.`};

const L={sh:46,th:46,to:58,ne:8,hd:10,ua:31,fa:29};
const rad=a=>a*Math.PI/180;
const V=(a,l)=>[Math.cos(rad(a))*l,Math.sin(rad(a))*l];
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]],sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
function ik(sh,target,bend,soft){const d=sub(target,sh);let dist=Math.hypot(d[0],d[1]);const mx=L.ua+L.fa-.5;const a=Math.atan2(d[1],d[0]);
  if(soft){const s=mx-dist,k=1.2;if(s<8*k)dist=mx-k*Math.log(1+Math.exp(s/k))}/* 2.2: soft lockout (softplus on the slack): the elbow never
     reaches the sqrt-steep last millimetres of full extension, so it settles smoothly instead of stopping dead */
  dist=Math.min(Math.max(dist,Math.abs(L.ua-L.fa)+.5),mx);
  const c=(L.ua*L.ua+dist*dist-L.fa*L.fa)/(2*L.ua*dist);const th=Math.acos(Math.max(-1,Math.min(1,c)));const ea=a+bend*th;
  const elbow=[sh[0]+Math.cos(ea)*L.ua,sh[1]+Math.sin(ea)*L.ua];const hand=[sh[0]+Math.cos(a)*dist,sh[1]+Math.sin(a)*dist];return[elbow,hand]}
function legsFrom(hip,th,sn){const k=add(hip,V(th,L.th));return[k,add(k,V(sn,L.sh))]}
function solve(p){
  const o={};let hip,sh;
  if(p.anchor==="foot"){const ank=p.at||[0,0];const k=sub(ank,V(p.shin,L.sh));hip=sub(k,V(p.thigh,L.th));o.knee=k;o.ankle=ank;sh=add(hip,V(p.torso,L.to))}
  else if(p.anchor==="hip"){hip=p.at||[0,0];sh=add(hip,V(p.torso,L.to))}
  else if(p.anchor==="shoulder"){sh=p.at;hip=sub(sh,V(p.torso,L.to))}
  else if(p.anchor==="hand"){const hand=p.at||[0,0];const el=sub(hand,V(p.fore,L.fa));sh=sub(el,V(p.upper,L.ua));hip=sub(sh,V(p.torso,L.to));o.elbow=el;o.hand=hand}
  {const so=add(V(p.torso,p._scE||0),V(p.torso+90,p._scR||0));if(p.anchor==='hand')hip=sub(hip,so);else if(p.anchor!=='shoulder')sh=add(sh,so)}
  if(!o.knee){const[k,a]=legsFrom(hip,p.thigh,p.shin);o.knee=k;o.ankle=a}
  o.hip=hip;o.sh=sh;
  const armAng=(u,f)=>p.rel?[p.torso+u,p.torso+f]:[u,f];
  if(!o.hand){
    o.back=add(sh,V(p.torso+150,7));
    if(p.handAt){[o.elbow,o.hand]=ik(sh,p.handAt,p.bend||1)}
    else if(p.handTo==="back"){o.hand=add(sh,V(p.torso+158,8));o.elbow=add(sh,V(p.torso+168,21))}
    else if(p.handTo==="hip"){[o.elbow,o.hand]=ik(sh,add(hip,[3,4]),p.bend||1)}
    else if(p.hand){[o.elbow,o.hand]=ik(sh,add(sh,p.hand),p.bend||-1,1)}
    else{const[u,f]=armAng(p.upper,p.fore);o.elbow=add(sh,V(u,L.ua));o.hand=add(o.elbow,V(f,L.fa))}
  }
  if(p.hand2){[o.elbow2,o.hand2]=ik(sh,add(sh,p.hand2),p.bend2||-1,1)}
  else if(p.upper2!=null){o.elbow2=add(sh,V(p.upper2,L.ua));o.hand2=add(o.elbow2,V(p.fore2,L.fa))}
  else{o.elbow2=add(o.elbow,[-3,1.5]);o.hand2=add(o.hand,[-3,1.5])}
  if(p.thigh2!=null){const[k,a]=legsFrom(hip,p.thigh2,p.shin2);o.knee2=k;o.ankle2=a}
  else{o.knee2=add(o.knee,[-3,1.5]);o.ankle2=add(o.ankle,[-3,1.5])}
  const ha=p.torso+(p.neck||0);o.neck=add(sh,V(ha,L.ne));o.head=add(sh,V(ha,L.ne+L.hd));
  const fa=p.foot!=null?p.foot:0;o.toe=add(o.ankle,V(fa,11));o.toe2=add(o.ankle2,V(p.foot2!=null?p.foot2:fa,11));

const lerp=(a,b,t)=>a+(b-a)*t;
function lerpPose(A,B,t){const o={};for(const k in A){const a=A[k],b=B[k];if(typeof a==="number"&&typeof b==="number")o[k]=lerp(a,b,t);else if(Array.isArray(a)&&Array.isArray(b))o[k]=a.map((v,i)=>lerp(v,b[i],t));else o[k]=a}return o}

const DAYS=["A","B","C"];const WEEKMS=7*864e5;
function cycStart(){if(!S.cycleStart){const first=S.history.length?new Date(S.history[0].date):new Date();S.cycleStart=weekStart(first).getTime();save()}return S.cycleStart}
function cycleWeek(d){const w=Math.round((weekStart(d||new Date()).getTime()-cycStart())/WEEKMS);return((w%4)+4)%4+1}
function dayDef(week,day){const W=PROGRAM[(week||1)-1]||PROGRAM[0];return W.days.find(x=>x.key===day)||W.days[0]}
function planItems(day,quick,week){week=week||progBlock();const d=dayDef(week,day);let it=d.items.map((v,i)=>({ex:v[0],sets:v[1],lo:v[2],hi:v[3],slot:i}));
  it.push({ex:d.fin[0],sets:d.fin[1],lo:d.fin[2],hi:d.fin[3],slot:it.length,fin:true});
  it=adaptItems(day,it);it=kbMix(day,it);it.push(holdFin(day,week,it));it=fitHour(it);
  if(S.rr&&typeof S.rr==="object")it=it.map(x=>{const o=!x.fin&&S.rr[x.ex];return Array.isArray(o)?{...x,lo:o[0],hi:o[1],rr:1}:x});/* 3.0: rep target changed after a plateau */
  if(quick)it=it.filter(x=>!x.fin).slice(0,4).map(x=>({...x,sets:Math.max(2,x.sets-1)}));return it}
function doneThisWeek(){const ws=weekStart(new Date());return new Set(S.history.filter(h=>new Date(h.date)>=ws).map(h=>h.plan))}/* calendar week, only for the week card (and the 2.x migration) */
/* ================= 3.0 · PLAN NACH ERLEDIGTEN EINHEITEN (@ Joschy) =================
   S.prog = {v:1, block:1–4 (PROGRAM-Woche), done:["A",…] (im laufenden Block erledigt), cycle:≥1, units:Anzahl Plan-Einheiten, dlLeft:Entlastungs-Einheiten übrig, dlAt:units beim letzten Entlastungs-Ende}
   A Drücken → B Ziehen → C Beine kommen immer der Reihe nach, egal wie viele Trainings pro Woche: keine Einheit fällt aus.
   Nach drei erledigten Einheiten (A, B, C) wechselt die Wochen-Variation (Block), nach 12 Einheiten beginnt der Zyklus neu.
   Entscheidung Kurz-Training ("Kurz", S.settings.quick): wird wie bisher gespeichert (Verlauf, Rekorde, Steigerung), zählt aber NICHT als
   Plan-Einheit – sonst würde eine verkürzte Einheit die komplette ersetzen. Die nächste komplette Einheit bleibt dieselbe.
   Yoga zählt nie als Einheit und bleibt beim Kalenderwochen-Takt (S.yoga). */
function validProg(p){return!!p&&typeof p==="object"&&!Array.isArray(p)&&Number.isInteger(p.block)&&p.block>=1&&p.block<=4&&Array.isArray(p.done)&&p.done.length<3&&p.done.every(d=>DAYS.includes(d))&&new Set(p.done).size===p.done.length&&Number.isInteger(p.cycle)&&p.cycle>=1}
/* pure: derive the position from a 2.x state (calendar week + history). The current program week stays, the next unit is the one
   of A, B, C not yet done in that week; a running session keeps its own week and day. Never touches history, records or weights. */
function deriveProg(st,now){now=now||Date.now();const H=Array.isArray(st.history)?st.history.filter(h=>h&&typeof h==="object"&&h.date&&!isNaN(new Date(h.date))):[];
  let cs=+st.cycleStart;if(!(cs>0)){const first=H.length?new Date(H[0].date):new Date(now);cs=weekStart(first).getTime()}
  const wIdx=d=>Math.round((weekStart(d).getTime()-cs)/WEEKMS);const wk=d=>((wIdx(d)%4)+4)%4+1;
  const ss=st.session&&typeof st.session==="object"&&!Array.isArray(st.session)?st.session:null;const run=ss&&!ss.quick&&DAYS.includes(ss.plan)&&Number.isInteger(ss.week)&&ss.week>=1&&ss.week<=4;
  let block=run?ss.week:wk(new Date(now));const ref=weekStart(new Date(run&&+ss.start>0?+ss.start:now)).getTime();
  let done=DAYS.filter(k=>!(run&&ss.plan===k)&&H.some(h=>h.plan===k&&!h.quick&&new Date(h.date).getTime()>=ref&&(h.week==null||+h.week===block)));
  let cref=run&&+ss.start>0?+ss.start:now;
  /* 3.0 · new calendar week, but the block of the last training is only partly done (e.g. A and B, C missing): continue there
     ("dort weitermachen, wo man ist") as long as the last unit is at most ~21 days ago. Otherwise (complete block or longer gap) the calendar decides. */
  const U=H.filter(h=>!h.quick&&DAYS.includes(h.plan)).map(h=>({h,t:new Date(h.date).getTime()})).sort((x,y)=>y.t-x.t);
  if(!run&&U.length&&U[0].t<=now&&now-U[0].t<=21*864e5&&weekStart(new Date(U[0].t)).getTime()<weekStart(new Date(now)).getTime()){
    const L=U[0];const b0=Number.isInteger(+L.h.week)&&+L.h.week>=1&&+L.h.week<=4?+L.h.week:wk(new Date(L.t));const seen=[];let prevT=L.t;
    for(const u of U){const b=Number.isInteger(+u.h.week)&&+u.h.week>=1&&+u.h.week<=4?+u.h.week:wk(new Date(u.t));
      if(b!==b0||seen.includes(u.h.plan)||prevT-u.t>21*864e5)break;seen.push(u.h.plan);prevT=u.t}
    if(seen.length>=1&&seen.length<3){block=b0;done=DAYS.filter(k=>seen.includes(k));cref=L.t}}
  const real=H.length>0||!!ss;/* 2.x data present → real migration; a fresh install gets no "mig" mark */
  const p={v:1,block,done,cycle:Math.max(1,Math.floor(wIdx(new Date(cref))/4)+1),units:H.filter(h=>!h.quick).length,dlLeft:0,dlAt:0,at:new Date(now).toISOString()};
  if(real)p.mig="2.x";
  if(p.done.length>=3){p.done=[];p.block=p.block%4+1;if(p.block===1)p.cycle++}
  p.dlAt=p.units;if(st.settings&&st.settings.deload)p.dlLeft=3-p.done.length;
  return p}
function normProg(p){const i=(v,d)=>Number.isInteger(v)&&v>=0?v:d;p.v=1;p.units=i(p.units,0);p.dlLeft=Math.min(3,i(p.dlLeft,0));p.dlAt=Math.min(p.units,i(p.dlAt,p.units));return p}
/* idempotent: a valid S.prog is never touched again */
function migrate3(){if(validProg(S.prog)){normProg(S.prog);return false}S.prog=normProg(deriveProg(S));if(S.session&&typeof S.session==="object"&&S.session.unit==null)S.session.unit=!S.session.quick;save();return true}
function prog(){if(!validProg(S.prog))migrate3();return S.prog}
function progBlock(){return prog().block}
function nextUnit(){const p=prog();return DAYS.find(k=>!p.done.includes(k))||"A"}
function nextDay(){return nextUnit()}
/* a finished plan unit moves the position on; returns a short message for the toast */
function progAdvance(ss){const p=prog();if(!ss||ss.quick||ss.unit===false||!DAYS.includes(ss.plan))return null;if((ss.week||1)!==p.block||p.done.includes(ss.plan))return null;
  p.done.push(ss.plan);p.units++;let msg=null;
  if(S.settings.deload&&p.dlLeft>0){p.dlLeft--;if(p.dlLeft<=0){S.settings.deload=false;p.dlAt=p.units;msg="Entlastung geschafft – ab jetzt wieder normale Gewichte"}}
  if(p.done.length>=3){p.done=[];p.block=p.block%4+1;if(p.block===1)p.cycle++;msg=msg||(p.block===1?"Zyklus geschafft! Der nächste beginnt mit Block 1":"Block geschafft – weiter mit Block "+p.block)}
  return msg}
function progDots(p,cur){return`<div class="cycrow" aria-label="Position im Zyklus">${[1,2,3,4].map(b=>`<div class="cycb">${DAYS.map(k=>{const on=b<p.block||(b===p.block&&p.done.includes(k));const nx=b===p.block&&k===cur;return`<i class="${on?"on":""}${nx?" nx":""}" title="Block ${b} · ${k}"></i>`}).join("")}</div>`).join("")}</div>`}
/* 3.0 · re-entry after a break: offered when the last strength session is at least 14 days ago */
function gapDays(){let t=0;for(const h of S.history){const d=new Date(h&&h.date).getTime();if(d>t)t=d}return t?(Date.now()-t)/864e5:0}
function beginUnit(plan){if(gapDays()>=14){const d=Math.floor(gapDays());
    openSheet(`<h2 style="font-size:26px">Leichter Wiedereinstieg?</h2><p class="muted" style="margin:0">Deine letzte Einheit ist ${d} Tage her. Vorschlag für heute: <b>Gewichte −10 %</b> und bei den Nebenübungen <b>ein Satz weniger</b>. Danach geht's normal weiter.</p>
      <button class="btn primary block" id="reYes">Ja, leichter einsteigen</button><button class="btn block" id="reNo">Nein, normal trainieren</button>`);
    $("#reYes").onclick=()=>{closeSheet();startSession(plan,{re:true})};$("#reNo").onclick=()=>{closeSheet();startSession(plan,{re:false})};return}
  startSession(plan)}
function usedInCodes(key){const r=[];PROGRAM.forEach((W,wi)=>W.days.forEach(d=>{if(d.items.some(v=>v[0]===key)||d.fin[0]===key)r.push((wi+1)+d.key)}));return r}
function openMonth(){const p=prog();const cw=p.block;const nu=nextUnit();
  openSheet(`<div class="row between"><h2 style="font-size:24px">Zyklusplan</h2><button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <p class="muted" style="margin:0;font-size:13.5px">4 Blöcke mit je 3 Einheiten. Ein Block ist fertig, wenn A, B und C erledigt sind, egal wie lange das dauert. Nach 12 Einheiten beginnt der Zyklus von vorn, dann mit mehr Gewicht.</p>
   ${PROGRAM.map((W,wi)=>`<div class="card" ${wi+1===cw?'style="border-color:var(--arc)"':""}><div class="row between"><div class="label">Block ${wi+1} · ${esc(W.theme)}</div>${wi+1===cw?`<span class="tag">aktuell</span>`:wi+1<cw?`<span class="tag">✓</span>`:""}</div>
     ${W.days.map(d=>{const its=planItems(d.key,false,wi+1);const main=its.filter(x=>!x.fin),fins=its.filter(x=>x.fin);const st=wi+1<cw||(wi+1===cw&&p.done.includes(d.key))?" ✓":wi+1===cw&&d.key===nu?" ▶ nächste":"";return`<div><b style="font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase">${d.key} · ${esc(d.name)}${st}</b><div class="muted" style="font-size:12.5px">${main.map(x=>esc(EX[x.ex].n)+(x.adapted?"*":"")).join(" · ")}${fins.length?` · <i>Bonus: ${fins.map(f=>esc(EX[f.ex].n)).join(" + ")}</i>`:""}</div></div>`}).join("")}</div>`).join("")}
   ${PROGRAM.some((W,wi)=>W.days.some(d=>planItems(d.key,false,wi+1).some(x=>x.adapted)))?`<p class="muted" style="margin:0;font-size:12.5px">* an deine Ausstattung angepasst</p>`:""}`)}

function swapPool(it,day){day=day||(S.session&&S.session.plan)||"A";const isT=k=>EX[k].type==="time";const used=new Set((S.session&&S.session.items||[]).map(x=>x.ex));
  let c,h=[];if(it.hfin)c=(DAYHOLD[day]||DAYHOLD.A).filter(k=>!used.has(k)&&EX[k]&&k!==it.ex);
  else if(it.fin)c=(DAYFIN[day]||DAYFIN.A).filter(k=>!used.has(k)&&EX[k]&&k!==it.ex);
  else{const allowed=DAYEX[day]||[];const sub=SUB[it.ex];const rear=it.ex==="facepull"||sub==="rear";
    const same=k=>rear?["rear","rowp"].includes(SUB[k]):SUB[k]===sub&&k!=="facepull";
    const ok=k=>!used.has(k)&&k!==it.ex&&allowed.includes(k)&&EX[k]&&AN[animOf(k)]&&canDo(k);
    c=allowed.filter(k=>same(k)&&ok(k)&&isT(k)===isT(it.ex)&&!isHoldEx(k));
    /* hold variants of the same movement pattern; pure holds (time) only as alternative for assistance slots, never for the main lift */
    h=allowed.filter(k=>isHoldEx(k)&&ok(k)&&(rear?SUB[k]==="rear":SUB[k]===sub)&&(isT(k)===isT(it.ex)||it.slot>0));
    h.sort((a,b)=>(isT(a)!==isT(it.ex))-(isT(b)!==isT(it.ex)))}
  c=c.filter(k=>canDo(k));h=h.slice(0,2);
  return[it.ex,...c.slice(0,4-h.length),...h]}
function openSwap(){const ss=S.session;const it=curItem();const pool=swapPool(it);
  openSheet(`<div class="row between"><h2 style="font-size:24px">Übung tauschen</h2><button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    ss.log[ss.ei]={ex:ni.ex,sets:initSets(ni,sg)};
    if(ss.ei===0)wuSync(ss);ss.si=0;ss.annEi=null;save();closeSheet();renderTrain();toast("Getauscht: "+e.n)}}
/* gear changed during a running session: replace exercises that are no longer possible and have no finished set yet; finished sets are never touched */
function adaptSession(){const ss=S.session;if(!ss||!Array.isArray(ss.items)||!Array.isArray(ss.log))return false;let ch=false;
  for(let i=0;i<ss.items.length;i++){const it=ss.items[i];const lg=ss.log[i];if(!it||!EX[it.ex])continue;
    if(canDo(it.ex)){if(it.noGear){delete it.noGear;ch=true}continue}
    if(lg&&Array.isArray(lg.sets)&&lg.sets.some(x=>x&&x.done))continue;
    let k=swapPool(it).slice(1).find(k=>canDo(k));
    if(!k){const used=new Set(ss.items.map(x=>x.ex));const a=adaptItems(ss.plan||"A",[it])[0];if(a&&a.ex!==it.ex&&!used.has(a.ex)&&canDo(a.ex))k=a.ex}
    if(!k){if(!it.noGear){it.noGear=true;ch=true}continue}
    const ni={...it,ex:k,...(it.fin?(it.hfin?holdReps(k):convReps(it,k)):repsFor(it,k)),adapted:true,orig:it.orig||it.ex};delete ni.noGear;const sg=suggest(ni);ss.items[i]=ni;
    ss.log[i]={ex:ni.ex,sets:initSets(ni,sg)};
    if(i===ss.ei){ss.si=0;ss.annEi=null}if(i===0)wuSync(ss);ch=true}
  return ch}

/* ---- 3.0 · plateau: 3 sessions in a row that did not beat the best before them (kg, then reps; seconds for timed exercises).
   S.plat[ex] = {reset: ISO date (count only later sessions), later: ISO date of the last session when "Später" was tapped} ---- */
function perfOf(l){const d=l.sets.filter(s=>s.done);const w=Math.max(0,...d.map(s=>+s.w||0));return{w,r:d.filter(s=>Math.abs((+s.w||0)-w)<1e-9).reduce((a,s)=>a+(+s.r||0),0)}}
function better(a,b){return a.w>b.w+1e-9||(Math.abs(a.w-b.w)<1e-9&&a.r>b.r)}
function plateauOf(ex){if(S.settings.deload)return null;const P=(S.plat&&S.plat[ex])||{};const reset=P.reset?new Date(P.reset).getTime():0;
  const occ=occFor(ex,12).filter(o=>!o.h.deload&&!o.h.reentry&&new Date(o.h.date).getTime()>reset);if(occ.length<4)return null;
  if(P.later&&new Date(occ[0].h.date).getTime()<=new Date(P.later).getTime())return null;
  const seq=occ.slice(0,4).reverse().map(o=>perfOf(o.l));let best=seq[0];for(let i=1;i<4;i++){if(better(seq[i],best))return null;if(seq[i].w>best.w)best=seq[i]}
  return{n:3,best,last:occ[0]}}
function altRange(it){const isT=EX[it.ex].type==="time";if(isT)return{lo:Math.max(10,it.lo-10),hi:Math.max(15,it.hi-10)};return it.hi<=8?{lo:8,hi:12}:it.hi<=12?{lo:12,hi:15}:{lo:8,hi:12}}
function platCard(it,pl){const e=EX[it.ex];const isT=e.type==="time";const ar=altRange(it);const w=+(S.session.log[S.session.ei].sets[0]||{}).w||0;const pool=swapPool(it).length>1;
  return`<div class="card plat" id="platCard"><div class="label">Plateau erkannt</div><div style="font-size:14.5px"><b>${esc(e.n)}:</b> ${pl.n} Einheiten in Folge ohne Fortschritt (bestes Ergebnis ${pl.best.w>0?fmtKg(pl.best.w)+" kg × ":""}${pl.best.r}${isT?" s":" Wdh."} gesamt). Was möchtest du ändern?</div>
   <div class="row"><button class="btn small" data-plat="a">${w>0?`Gewicht −10 % (${fmtKg(wFloor(it.ex,w*.9))} kg) & neu aufbauen`:isT?"Zeit −10 % & neu aufbauen":"Wdh. −10 % & neu aufbauen"}</button>
   <button class="btn small" data-plat="b">Neues Ziel ${ar.lo}–${ar.hi}${isT?" s":" Wdh."}</button>${pool?`<button class="btn small" data-plat="c">Variante wählen</button>`:""}<button class="btn small ghost" data-plat="later">Später</button></div></div>`}
function platSet(ex,o){S.plat=S.plat&&typeof S.plat==="object"?S.plat:{};S.plat[ex]={...(S.plat[ex]||{}),...o}}
function bindPlat(it){if(!$("#platCard"))return;const ss=S.session;const lg=ss.log[ss.ei];const e=EX[it.ex];const now=new Date().toISOString();

function summary(ss){let sets=0,vol=0;const prs=[];
  for(const l of ss.log){let best=null;for(const s of l.sets)if(s.done){sets++;if(EX[l.ex].type!=="time")vol+=(+s.w||0)*(+s.r||0);if(EX[l.ex].type!=="time"&&+s.w>0&&(!best||e1(s)>e1(best)))best=s}
    if(best){let prev=0;for(const h of S.history)for(const x of h.log)if(x.ex===l.ex)for(const s of x.sets)if(s.done&&+s.w>0)prev=Math.max(prev,e1(s));if(prev>0&&e1(best)>prev+0.01)prs.push({ex:l.ex,w:best.w,r:best.r})}}
  return{sets,vol,prs}}

    unit:!ss.quick&&ss.unit!==false,cyc:ss.cyc||(S.prog&&S.prog.cycle)||1,
    log:ss.log.map(l=>{const o={ex:l.ex,sets:l.sets.filter(s=>s.done).map(s=>({w:+s.w,r:+s.r,done:true}))};if(EFF[l.eff])o.eff=l.eff;return o}).filter(l=>l.sets.length)};
  if(ss.quick)rec.quick=true;if(ss.deload)rec.deload=true;if(ss.reentry)rec.reentry=true;
  const wu=ss.wu&&Array.isArray(ss.wu.sets)?ss.wu.sets.filter(x=>x&&x.done).map(x=>({w:+x.w,r:+x.r,p:+x.p})):[];const wup=Array.isArray(ss.wuPrev)?ss.wuPrev.filter(x=>x&&EX[x.ex]&&Array.isArray(x.sets)&&x.sets.length):[];
  if(wu.length||wup.length)rec.warmup=[...wup,...(wu.length?[{ex:ss.wu.ex,sets:wu}]:[])];/* kept apart: no records, no volume */
  let msg=null;if(rec.log.length){S.history.push(rec);msg=rec.unit?progAdvance(ss):null}
  S.pick=null;S.session=null;save();closeTrain();toast(rec.log.length?msg?"Gespeichert · "+msg:"Training gespeichert":"Nichts zu speichern")};
  $("#backS").onclick=()=>{const ss=S.session;ss.phase="work";ss.ei=ss.items.length-1;const lg=ss.log[ss.ei];const i=lg.sets.findIndex(s=>!s.done);ss.si=i<0?lg.sets.length-1:i;if(i<0)lg.sets[ss.si].done=false;save();renderTrain()}}

function lineChart(c,pts,dec){const dpr=devicePixelRatio||1,W=c.clientWidth,Hh=c.clientHeight;c.width=W*dpr;c.height=Hh*dpr;const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,Hh);
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));const pv=Math.max(.5,(hi-lo)*.2);lo-=pv;hi+=pv;const L0=36,R0=10,T0=8,B0=18;
  const X=i=>L0+(W-L0-R0)*i/Math.max(1,pts.length-1),Y=v=>T0+(Hh-T0-B0)*(1-(v-lo)/(hi-lo));const font="11px "+getComputedStyle(document.body).fontFamily;
  x.strokeStyle=CSS["--line"];x.fillStyle=CSS["--faint"];x.font=font;x.textAlign="right";for(let g=0;g<=2;g++){const v=lo+(hi-lo)*g/2;const y=Y(v);x.beginPath();x.moveTo(L0,y);x.lineTo(W-R0,y);x.stroke();x.fillText(v.toFixed(dec),L0-6,y+4)}

function mgOf(k){if(Object.prototype.hasOwnProperty.call(MG_OF,k))return MG_OF[k];const e=EX[k];if(!e)return null;
  if(e.base&&Object.prototype.hasOwnProperty.call(MG_OF,e.base))return MG_OF[e.base];
  return{beine:"vorn",huefte:"hinten",brust:"brust",schulter:"schulter",ruecken:"ruecken",rumpf:"rumpf",arme:/trizeps/i.test(e.m||"")?"trizeps":"bizeps"}[CAT[k]]||null}
const MAIN_LIFTS=["squat","bench","deadlift","ohp"];
const MG_LO=10,MG_HI=20,MG_WARN=6,DAYMS=864e5;
const MEAS=[["brust","Brust"],["arm","Oberarm"],["taille","Taille"],["bein","Oberschenkel"]];
function hOk(h){return!!h&&typeof h==="object"&&Array.isArray(h.log)&&isFinite(new Date(h.date).getTime())}
function sDone(s){return!!s&&typeof s==="object"&&s.done!==false}
function dkey(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mkey(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function dT(k){const[y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d,12).getTime()}
function validDk(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(k)))return false;const[y,m,d]=k.split("-").map(Number);const x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d}
function rmAble(k){const e=EX[k];return!!e&&(e.type==="bar"||e.type==="db")}
/* geschätztes 1RM nach Epley, nur Sätze mit Gewicht > 0 und 1–12 Wiederholungen */
function rmOf(k,s){if(!rmAble(k)||!sDone(s))return null;const w=+s.w,r=+s.r;return w>0&&r>=1&&r<=12?w*(1+r/30):null}
const f1=v=>(Math.round(v*10)/10).toLocaleString("de-DE",{maximumFractionDigits:1});
const fSign=(v,u)=>{const r=Math.round(v*10)/10;return(r>0?"+":r<0?"−":"±")+f1(Math.abs(r))+(u?" "+u:"")};
const fDs=t=>new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
const fDl=t=>new Date(t).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fMon=t=>new Date(t).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
function fDur(sec){const m=Math.round((+sec||0)/60);const h=Math.floor(m/60);return h?h+" Std. "+(m%60)+" Min.":m+" Min."}
function yLog(){const y=S.yoga;return y&&typeof y==="object"&&Array.isArray(y.log)?y.log:[]}
function wkShift(ws,n){const d=new Date(ws);d.setDate(d.getDate()+7*n);return weekStart(d).getTime()}
function isoWeek(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/DAYMS-3+(w1.getDay()+6)%7)/7)}
function bodyList(){return(Array.isArray(S.body)?S.body:[]).filter(b=>b&&validDk(b.d)&&isFinite(+b.kg)&&+b.kg>0).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
let ST=null;
function stKey(){const H=S.history,Y=yLog(),a=H[0],z=H[H.length-1],y=Y[Y.length-1];return[todayKey(),H.length,a&&a.date,z&&z.date,Y.length,y&&y.date].join("|")}
function stats(){const key=stKey();if(ST&&ST.key===key)return ST;const t0=performance.now();
  const ses=[];
  S.history.forEach((h,i)=>{if(!hOk(h))return;const t=new Date(h.date).getTime();const g={},rm={},sc={};let sets=0,vol=0;
    for(const l of h.log){if(!l||!EX[l.ex]||!Array.isArray(l.sets))continue;const e=EX[l.ex],mg=mgOf(l.ex),wt=rmAble(l.ex);
      for(const s of l.sets){if(!sDone(s))continue;sets++;if(mg)g[mg]=(g[mg]||0)+1;const w=+s.w||0,r=+s.r||0;if(e.type!=="time")vol+=w*r;
        const v=wt?rmOf(l.ex,s):(r>0?r:null);if(v==null)continue;if(wt&&!(rm[l.ex]>=v))rm[l.ex]=v;if(!(sc[l.ex]>=v))sc[l.ex]=v}}
    ses.push({i,t,day:dkey(t),wk:weekStart(t).getTime(),mon:mkey(t),plan:DAYS.includes(h.plan)?h.plan:"A",quick:!!h.quick,dur:Math.max(0,+h.dur||0),sets,vol,g,rm,sc,prs:[]})});
  ses.sort((a,b)=>a.t-b.t||a.i-b.i);
  /* neue Rekorde: Gewichtsübungen über das geschätzte 1RM, sonst über Wiederholungen/Sekunden; die erste Einheit einer Übung ist kein Rekord */
  const best={};for(const s of ses)for(const k in s.sc){const v=s.sc[k];if(best[k]!=null&&v>best[k]+.01)s.prs.push({ex:k,v});if(!(best[k]>=v))best[k]=v}
  const byWk=new Map(),byDay=new Map();
  for(const s of ses){let w=byWk.get(s.wk);if(!w){w={n:0,g:{}};byWk.set(s.wk,w)}w.n++;for(const k in s.g)w.g[k]=(w.g[k]||0)+s.g[k];
    if(!byDay.has(s.day))byDay.set(s.day,[]);byDay.get(s.day).push(s)}
  const yo=[],yDay=new Map();for(const y of yLog()){if(!y||typeof y!=="object")continue;const t=new Date(y.date).getTime();if(!isFinite(t))continue;yo.push({t,day:dkey(t),mon:mkey(t),kind:y.kind,week:y.week,dur:Math.max(0,+y.dur||0)})}
  yo.sort((a,b)=>a.t-b.t);for(const y of yo){if(!yDay.has(y.day))yDay.set(y.day,[]);yDay.get(y.day).push(y)}
  ST={key,ses,byWk,byDay,yo,yDay,streak:streaks(byWk),ms:0};ST.ms=performance.now()-t0;return ST}
/* Serie: Kalenderwochen (Mo–So) in Folge mit mindestens 2 Krafttrainings (Kurz-Trainings zählen mit, Yoga nicht).
   Die laufende Woche zählt mit, sobald sie 2 Trainings hat; vorher bricht sie die Serie nicht. */
function streaks(byWk){const ok=w=>{const x=byWk.get(w);return!!x&&x.n>=2};let cur=0,w=weekStart(new Date()).getTime();if(!ok(w))w=wkShift(w,-1);while(ok(w)){cur++;w=wkShift(w,-1)}
  const ks=[...byWk.keys()].filter(ok).sort((a,b)=>a-b);let best=0,run=0,prev=null;for(const k of ks){run=prev!=null&&wkShift(prev,1)===k?run+1:1;if(run>best)best=run;prev=k}return{cur,best:Math.max(best,cur)}}
function mgWeeks(n){const st=stats();const out=[];let w=weekStart(new Date()).getTime();for(let i=0;i<n;i++){const x=st.byWk.get(w);out.unshift({ws:w,g:x?x.g:{},n:x?x.n:0});w=wkShift(w,-1)}return out}
/* 3.0 · Plan-Soll: Arbeitssätze, die der eigene Plan (aktueller Block, aktuelle Geräte, ohne Kurz-Training) für eine Muskelgruppe
   in einem Durchgang A+B+C vorsieht – gezählt wie in stats(). Der Plan ist für 2–3 Einheiten pro Woche gebaut:
   ein Durchgang pro Woche = Soll, zwei Einheiten pro Woche = 2/3 davon. Beides ist „Plan erfüllt“. */
const MG_PLAN_MIN=2/3,MG_PLAN_WARN=.7;
function mgSoll(){const b=progBlock();const g={};for(const d of DAYS){let its=[];try{its=planItems(d,false,b)}catch(e){its=[]}
    for(const it of its){const m=it&&mgOf(it.ex);if(m)g[m]=(g[m]||0)+(Math.max(0,+it.sets||0))}}return g}
/* Gruppen, deren Schnitt der letzten (bis zu) 4 abgeschlossenen Wochen unter ca. 70 % des Plan-Solls bei 2 Einheiten pro Woche liegt –
   also wirklich Einheiten ausgefallen sind. Gruppen ohne Sätze im Plan werden nie gemeldet. Der allgemeine Richtwert 10–20 warnt nicht mehr. */
function mgLow(soll){const st=stats();if(!st.ses.length)return[];const first=st.ses[0].wk;const W=mgWeeks(5).slice(0,4).filter(x=>x.ws>=first);if(W.length<2)return[];soll=soll||mgSoll();
  return MG.map(([k,l])=>({k,l,soll:soll[k]||0,avg:W.reduce((a,x)=>a+(x.g[k]||0),0)/W.length})).filter(x=>x.soll>0&&x.avg<MG_PLAN_WARN*MG_PLAN_MIN*x.soll)}
function rmSeries(k){const out=[];for(const s of stats().ses){const v=s.rm[k];if(v!=null)out.push({t:s.t,v,i:s.i})}return out}
function rmCounts(){const n={};for(const s of stats().ses)for(const k in s.rm)n[k]=(n[k]||0)+1;return n}
/* Veränderung 4 Wochen: bester Wert der letzten 28 Tage gegenüber dem besten Wert der 28 Tage davor (fehlt der, der letzte ältere Wert) */
function rmInfo(k){const pts=rmSeries(k);if(!pts.length)return null;let b=pts[0];for(const p of pts)if(p.v>b.v+1e-9)b=p;const now=Date.now(),a=now-28*DAYMS,a2=now-56*DAYMS;
  const mx=(lo,hi)=>{let m=null;for(const p of pts)if(p.t>=lo&&p.t<hi&&(m==null||p.v>m))m=p.v;return m};const cur=mx(a,Infinity);let prev=mx(a2,a);
  if(prev==null){const old=pts.filter(p=>p.t<a);if(old.length)prev=old[old.length-1].v}
  return{pts,best:b,last:pts[pts.length-1],cur,prev,d4:cur!=null&&prev!=null?cur-prev:null}}
function normMeas(a){if(!Array.isArray(a))return[];const by={};const num=v=>{if(typeof v==="string")v=v.trim().replace(",",".");if(v===""||v==null||typeof v==="boolean")return null;const n=+v;return isFinite(n)&&n>=10&&n<=300?Math.round(n*10)/10:null};
  for(const x of a){if(!x||typeof x!=="object"||Array.isArray(x)||!validDk(x.d))continue;const o=by[x.d]||{d:x.d};for(const[k]of MEAS){const v=num(x[k]);if(v!=null)o[k]=v}by[x.d]=o}
  return Object.values(by).filter(o=>Object.keys(o).length>1).sort((p,q)=>p.d<q.d?-1:1)}
function measNum(v){v=String(v==null?"":v).trim().replace(",",".");if(!/^\d{1,3}(\.\d+)?$/.test(v))return null;const n=+v;return n>=10&&n<=300?Math.round(n*10)/10:null}
function meas(){if(!Array.isArray(S.meas))S.meas=[];return S.meas}

/* ---------- Diagramm über die Zeit (Farben aus den Design-Variablen) ---------- */
function tChart(c,pts,o){o=o||{};const dpr=Math.min(devicePixelRatio||1,2),W=c.clientWidth,Hh=c.clientHeight;if(!W||!Hh)return;c.width=Math.round(W*dpr);c.height=Math.round(Hh*dpr);
  const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,Hh);const ff=getComputedStyle(document.body).fontFamily;
  if(pts.length<2){x.fillStyle=CSS["--muted"];x.font="13px "+ff;x.textAlign="center";x.fillText(pts.length?"Ab dem zweiten Wert erscheint hier eine Kurve.":"Noch keine Daten",W/2,Hh/2);return}
  let lo=Infinity,hi=-Infinity;for(const p of pts){if(p.v<lo)lo=p.v;if(p.v>hi)hi=p.v}const pad=Math.max(o.pad||1,(hi-lo)*.15);lo-=pad;hi+=pad;
  const tA=pts[0].t,tB=pts[pts.length-1].t,span=Math.max(1,tB-tA);x.font="11px "+ff;
  const labs=[0,1,2,3].map(g=>f1(lo+(hi-lo)*g/3));const L0=Math.ceil(Math.max(...labs.map(s=>x.measureText(s).width)))+10,R0=12,T0=10,B0=20;
  const X=t=>L0+(W-L0-R0)*(t-tA)/span,Y=v=>T0+(Hh-T0-B0)*(1-(v-lo)/(hi-lo));
  x.strokeStyle=CSS["--line"];x.lineWidth=1;x.fillStyle=CSS["--faint"];x.textAlign="right";
  for(let g=0;g<=3;g++){const y=Y(lo+(hi-lo)*g/3);x.beginPath();x.moveTo(L0,y);x.lineTo(W-R0,y);x.stroke();x.fillText(labs[g],L0-6,y+4)}
  x.fillStyle=CSS["--muted"];x.textAlign="left";x.fillText(fDs(tA),L0,Hh-5);x.textAlign="right";x.fillText(fDs(tB),W-R0,Hh-5);
  const grad=x.createLinearGradient(0,T0,0,Hh-B0);grad.addColorStop(0,ACol(.28));grad.addColorStop(1,ACol(0));
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));x.lineTo(X(tB),Hh-B0);x.lineTo(X(tA),Hh-B0);x.closePath();x.fillStyle=grad;x.fill();
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));x.strokeStyle=CSS["--accent"];x.lineWidth=2.2;x.lineJoin="round";x.stroke();
  if(pts.length<=80)for(const p of pts){x.beginPath();x.arc(X(p.t),Y(p.v),2.4,0,7);x.fillStyle=CSS["--accent"];x.fill()}
  const lp=pts[pts.length-1];x.beginPath();x.arc(X(lp.t),Y(lp.v),4.5,0,7);x.fillStyle=CSS["--accent"];x.fill();
  if(o.best){x.beginPath();x.arc(X(o.best.t),Y(o.best.v),7,0,7);x.strokeStyle=CSS["--fg"];x.lineWidth=2;x.stroke()}}

  const W=mgWeeks(8),cur=W[7];const soll=mgSoll();const mx=Math.max(24,...MG.map(([k])=>Math.max(cur.g[k]||0,soll[k]||0)));const pc=v=>(v/mx*100).toFixed(2)+"%";
  const we=new Date(cur.ws);we.setDate(we.getDate()+6);const low=mgLow(soll);

  const sl=MG.filter(([k])=>soll[k]>0).map(([k,l])=>`${l} ${soll[k]}`).join(" · ");

   <div class="mglist">${MG.map(([k,l])=>{const v=cur.g[k]||0;return`<div class="mgrow" data-mg="${k}"><span class="mgl">${l}</span><span class="mgbar">${soll[k]?`<i class="zone" title="Soll laut Plan: ${soll[k]} Sätze pro Durchgang" style="left:${pc(lo(k))};width:${pc(soll[k]-lo(k))}"></i>`:""}<b class="${lv(v,k)}" style="width:${pc(Math.min(v,mx))}"></b></span><span class="num mgv">${v}</span></div>`}).join("")}</div>
   <div class="muted fine" id="mgSoll"><span class="zkey" aria-hidden="true"></span> Markierung = Soll laut deinem Plan (2–3 Einheiten pro Woche, Block ${progBlock()}, deine Geräte). Sätze pro Durchgang A+B+C: ${sl||"–"}.</div>
   <div class="muted fine">Gezählt: erledigte Arbeitssätze ohne Aufwärmsätze, je Übung bei der Haupt-Muskelgruppe, Halte-Übungen ja, Ausdauer-Finisher nein. Info: Allgemeiner Richtwert 10–20 Sätze pro Woche.</div>
   ${low.length?`<div class="hint" id="mgLow"><b>Weniger als im Plan:</b> ${low.map(x=>`${x.l} Ø ${f1(x.avg)} pro Woche (Soll laut Plan: ${x.soll} Sätze pro Durchgang)`).join(", ")}. In den letzten Wochen sind Einheiten ausgefallen – mit 2–3 Einheiten pro Woche passt es wieder.</div>`:""}</div>
  <div class="card" id="mgHist"><div class="label">Letzte 8 Wochen</div>
   <div class="mgtab" role="table" aria-label="Sätze pro Muskelgruppe in den letzten 8 Wochen"><div class="mgr mgh" role="row"><span role="columnheader">KW</span>${W.map((w,i)=>`<span role="columnheader" class="${i===7?"now":""}">${isoWeek(w.ws)}</span>`).join("")}</div>
   ${MG.map(([k,l])=>`<div class="mgr" role="row" data-mgh="${k}"><span class="mgl" role="rowheader">${l}</span>${W.map((w,i)=>{const v=w.g[k]||0;return`<span role="cell" class="c ${lv(v,k)}${i===7?" now":""}">${v||"·"}</span>`}).join("")}</div>`).join("")}</div>
   <div class="muted fine">Hinterlegte Felder liegen im Soll laut Plan (2–3 Einheiten pro Woche, kräftiger: darüber). Die rechte Spalte ist die laufende Woche.</div></div>`}

/* ---------- Monatsbericht ---------- */
function monthDelta(list,mk,val){/* letzter Wert im Monat gegenüber dem letzten Wert vor dem Monat (sonst dem ersten im Monat) */
  const inM=list.filter(x=>x.d.slice(0,7)===mk&&val(x)!=null);if(!inM.length)return null;const before=list.filter(x=>x.d.slice(0,7)<mk&&val(x)!=null);
  const base=before.length?before[before.length-1]:inM[0];const last=inM[inM.length-1];return{last:val(last),base:val(base),bd:base.d,d:base===last?null:val(last)-val(base)}}
function repData(mk){const st=stats();const ms=st.ses.filter(s=>s.mon===mk);const ys=st.yo.filter(y=>y.mon===mk);
  const g={};let dur=0,vol=0,sets=0;const prs=[];for(const s of ms){dur+=s.dur;vol+=s.vol;sets+=s.sets;for(const k in s.g)g[k]=(g[k]||0)+s.g[k];for(const p of s.prs)prs.push({...p,t:s.t})}
  const prevMk=(()=>{const[y,m]=mk.split("-").map(Number);return mkey(new Date(y,m-2,1))})();
  const rm=[];for(const k of MAIN_LIFTS){let b=null;for(const s of ms)if(s.rm[k]!=null&&(b==null||s.rm[k]>b))b=s.rm[k];if(b==null)continue;
    let p=null;for(const s of st.ses)if(s.mon===prevMk&&s.rm[k]!=null&&(p==null||s.rm[k]>p))p=s.rm[k];let ref="Vormonat";
    if(p==null){let lt=null;for(const s of st.ses)if(s.mon<mk&&s.rm[k]!=null){p=s.rm[k];lt=s.t}if(p!=null)ref=fDs(lt)}
    rm.push({k,v:b,d:p!=null?b-p:null,ref})}
  const body=monthDelta(bodyList(),mk,x=>+x.kg);const ms2={};for(const[k]of MEAS)ms2[k]=monthDelta(meas(),mk,x=>x[k]!=null?x[k]:null);
  return{ms,ys,g,dur,vol,sets,prs,rm,body,meas:ms2,q:ms.filter(s=>s.quick).length,ydur:ys.reduce((a,y)=>a+y.dur,0)}}
function repView(){if(repM==null)repM=thisMonth();repM=Math.max(firstMonth(),Math.min(thisMonth(),repM));const mk=mkey(repM);const R=repData(mk);const run=repM===thisMonth();
  const has=R.ms.length||R.ys.length||R.body||MEAS.some(([k])=>R.meas[k]);const nav=monthNav(repM,firstMonth(),"repNav");
  if(!has)return`<div class="card" id="repCard">${nav}${emptyCard(`Noch keine Daten für ${fMon(repM)}.${S.history.length?"":" Nach deinem ersten Training entsteht hier jeden Monat ein Bericht."}`,"repEmpty")}</div>`;
  const prName=p=>{const e=EX[p.ex];return`${esc(e.n)} <span class="num">${rmAble(p.ex)?f1(p.v)+" kg":e.type==="time"?f1(p.v)+" s":f1(p.v)+" Wdh."}</span>`};
  const sec=(t,b)=>`<div class="rsec"><div class="label">${t}</div>${b}</div>`;
  const deltaRow=(lab,d,u,attr)=>`<div class="rrow" ${attr}><span>${lab}</span><span class="num">${f1(d.last)} ${u}${d.d!=null?` <small class="${d.d>0.05?"rup":d.d<-0.05?"rdn":""}">${fSign(d.d,u)}</small>`:""}</span></div>`;
  const bodyRows=(R.body?deltaRow("Körpergewicht",R.body,"kg",'data-rb="kg"'):"")+MEAS.map(([k,l])=>R.meas[k]?deltaRow(l,R.meas[k],"cm",`data-rb="${k}"`):"").join("");
  return`<div class="card report" id="repCard">${nav}
   <div class="row between"><h2 style="font-size:24px">Monatsbericht</h2>${run?`<span class="tag">läuft noch</span>`:""}</div>
   <div class="kpis k2"><div data-r="n"><span class="num">${R.ms.length}</span><span class="kl">Einheiten${R.q?` · davon ${R.q} kurz`:""}</span></div>
    <div data-r="dur"><span class="num">${fDur(R.dur)}</span><span class="kl">Trainingszeit</span></div>
    <div data-r="vol"><span class="num">${fmtKg(Math.round(R.vol))}<small> kg</small></span><span class="kl">bewegt</span></div>
    <div data-r="yoga"><span class="num">${R.ys.length}</span><span class="kl">Yoga${R.ys.length?` · ${fDur(R.ydur)}`:""}</span></div></div>
   ${sec(`Neue Rekorde · <span data-r="prs">${R.prs.length}</span>`,R.prs.length?`<ul class="rlist">${R.prs.slice(-6).reverse().map(p=>`<li>${prName(p)}<small class="muted"> · ${fDs(p.t)}</small></li>`).join("")}</ul>${R.prs.length>6?`<div class="muted fine">und ${R.prs.length-6} weitere</div>`:""}`:`<div class="muted fine">Diesen Monat kein neuer Rekord${run?" – noch nicht":""}.</div>`)}
   ${sec("Sätze je Muskelgruppe",R.ms.length?`<div class="rmg">${MG.map(([k,l])=>`<div data-rmg="${k}"><span>${l}</span><span class="num">${R.g[k]||0}</span></div>`).join("")}</div>`:`<div class="muted fine">Keine Krafttrainings in diesem Monat.</div>`)}
   ${sec("Maximalkraft · geschätzt",R.rm.length?R.rm.map(x=>`<div class="rrow" data-rrm="${x.k}"><span>${esc(EX[x.k].n)}</span><span class="num">${f1(x.v)} kg${x.d!=null?` <small class="${x.d>0.05?"rup":x.d<-0.05?"rdn":""}">${fSign(x.d,"kg")}</small>`:""}</span></div>`).join("")+`<div class="muted fine">Bester Wert im Monat, Veränderung gegenüber dem Vormonat (fehlt er, gegenüber dem letzten älteren Wert).</div>`:`<div class="muted fine">Keine Hauptübung mit Gewicht in diesem Monat.</div>`)}
   ${sec("Körper",bodyRows?bodyRows+`<div class="muted fine">Letzter Wert im Monat, Veränderung gegenüber dem letzten Wert davor.</div>`:`<div class="muted fine">Keine Messungen in diesem Monat.</div>`)}
  </div>`}

  ["So wirst du stärker: doppelte Progression",`<p>Jede Übung hat einen Wiederholungsbereich, z. B. 6–8. Bleib beim Gewicht, bis du in <strong>allen Sätzen die obere Zahl</strong> schaffst. Dann steigerst du: Oberkörper +2,5 kg, Beine und Kreuzheben +5 kg. Die App zeigt dir das automatisch an.</p><p><strong>Neu:</strong> Nach dem letzten Satz jeder Übung tippst du kurz <strong>leicht, passend oder hart</strong>. War es leicht, steigert die App früher oder in größeren Schritten, war es hart, hält sie das Gewicht. Tritt eine Übung drei Einheiten lang auf der Stelle, schlägt sie dir eine Änderung vor.</p><p>Die letzten 1–2 Wiederholungen sollen schwer sein, aber du hättest noch 1–2 mehr geschafft. Kein Satz bis zum totalen Versagen nötig.</p>`],
  ["Essen für Muskelaufbau",`<p><strong>Eiweiß:</strong> etwa 1,6–2 g pro kg Körpergewicht, bei 70 kg also rund 110–140 g am Tag, verteilt auf 3–4 Mahlzeiten.</p><p><strong>Gute Quellen:</strong> Linsen, Kichererbsen, Eier, Fisch, Hähnchen, Joghurt, Quark, Paneer, Tofu. Ein Dal mit Joghurt oder ein Fisch-Curry mit Reis passt perfekt.</p><p><strong>Kalorien:</strong> leicht mehr essen als du verbrauchst, etwa 200–300 kcal am Tag. Wiegst du dich wöchentlich, sind 0,25–0,5 kg Zunahme pro Monat ein gutes Tempo.</p>`],
  ["Schlaf und Erholung",`<p>Muskeln wachsen in der Pause, nicht beim Training. Ziel: <strong>7–9 Stunden Schlaf</strong>.</p><p>Zwischen zwei Einheiten mindestens ein Ruhetag. Bei 3 Einheiten z. B. Mo · Mi · Fr, bei 2 Einheiten Di · Fr.</p><p><strong>Entlastung:</strong> Alle 6–8 Blöcke drei Einheiten (einen Block) mit etwa 60 % der Gewichte trainieren. Die App erinnert dich daran. Gelenke und Sehnen danken es dir, gerade ab 40.</p>`],
  ["Vitamin D im deutschen Winter",`<p>Von Oktober bis März reicht die Sonne in Deutschland kaum, um Vitamin D zu bilden. Dunklere Haut bildet bei gleicher Sonne weniger Vitamin D. Wer dunklere Haut hat, ist daher häufiger von einem Mangel betroffen.</p><p>Vitamin D ist wichtig für Knochen und Muskeln. Lass den Spiegel beim Hausarzt messen und frag, ob und wie viel du ergänzen solltest.</p>`],
  ["Kreatin",`<p>Kreatin-Monohydrat ist das am besten untersuchte Nahrungsergänzungsmittel für Kraft und Muskelaufbau: <strong>3–5 g täglich</strong>, egal zu welcher Uhrzeit, keine Ladephase nötig. Wenn du Nierenprobleme hast, vorher ärztlich abklären.</p>`],
  ["Sicherheit im Rack",`<p><strong>Sicherheitsablagen</strong> immer einstellen: bei Kniebeuge knapp unter dem tiefsten Punkt, beim Bankdrücken auf Brusthöhe.</p><p><strong>Klemmen</strong> immer auf die Stange. Scheiben gleichmäßig auf beiden Seiten auf- und abladen.</p><p>Wenn eine Wiederholung nicht hochgeht: Stange kontrolliert auf die Ablagen legen. Darum trainierst du im Rack.</p>`],
  ["Technik verbessern",`<p>Film dich ab und zu von der Seite mit dem Handy und vergleich es mit der Animation. Achte auf Rücken, Kniestellung und Bewegungstiefe.</p><p>Neue Übung oder unsicher? Lieber eine Woche mit leichtem Gewicht nur die Bewegung üben.</p>`],
  ["Ausdauer und Boxsack",`<p>Herz und Kreislauf profitieren von 1–2 lockeren Einheiten pro Woche: 20–30 Min. Crosstrainer oder Laufband an trainingsfreien Tagen. Das bremst den Muskelaufbau nicht.</p><p>Als Abschluss nach dem Krafttraining: <strong>3 Runden à 1 Min. Boxsack</strong>, 1 Min. Pause. Gut für Kondition und Kopf.</p>`]];
  $("#v-tips").innerHTML=`<h1 style="font-size:34px">Tipps</h1>${T.map((t,i)=>`<details class="tip" ${i===0?"open":""}><summary>${t[0]}</summary><div>${t[1]}</div></details>`).join("")}
   <div class="card"><div class="label">Deine Ausstattung</div>${myGear().length?`<ul class="cues" style="color:var(--muted)">${GEAR.filter(g=>hasGear(g.id)).map(g=>`<li>${esc(g.l)}</li>`).join("")}</ul>`:`<p class="muted" style="margin:0">Keine Geräte ausgewählt. Die App nutzt Übungen mit Körpergewicht.</p>`}<span class="muted" style="font-size:12.5px">Ändern unter Einstellungen → Meine Ausstattung.</span></div>
   <p class="muted" style="font-size:12.5px;margin:0">Diese App ersetzt keine ärztliche Beratung. Bei Schmerzen in Brust, Gelenken oder Rücken: Training stoppen und abklären lassen.</p>`}

function onbGear(a){const isJ=/^(joschy|yoshi)$/i.test(a.n);const sel=isJ?[...JOSCHYGEAR]:(S.profile&&Array.isArray(S.profile.gear)?[...S.profile.gear]:[]);sel._picked=isJ?"joschy":null;

    S.body=S.body||[];const d=todayKey();if(!S.body.some(b=>b.d===d))S.body.push({d,kg:a.kg});save();$("#onb").hidden=true;go("home");toast("Hallo, "+a.n+"!")}}

/* ================= ANDROID BACK ================= */
window.appBack=function(){
  if(!$("#onb").hidden)return;
  if(!$("#sheetBg").hidden){closeSheet();return}
  if(!$("#rest").hidden){return}

function drawMat(ctx,def,o,P,R,fl,front,tr){const cx=def.matX!=null?def.matX:(tr.bx0+tr.bx1)/2;const hw=front?Math.max(52,(tr.bx1-tr.bx0)/2+8):Math.max(70,Math.min(104,(tr.bx1-tr.bx0)/2+16));
  const A=P([cx-hw,fl]),B=P([cx+hw,fl]);const d=R(front?16:5);const k=front?.35:.9;
  ctx.save();ctx.beginPath();ctx.moveTo(A[0]+d*k,A[1]-d);ctx.lineTo(B[0]+(front?-d*k:d*k),B[1]-d);ctx.lineTo(B[0],B[1]);ctx.lineTo(A[0],A[1]);ctx.closePath();
  const g=ctx.createLinearGradient(0,A[1]-d,0,A[1]);g.addColorStop(0,"#123540");g.addColorStop(1,"#1d5565");ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle="#0b222b";ctx.fillRect(A[0],A[1],B[0]-A[0],Math.max(1.5,R(1.8)));

/* ---------- state (S.yoga: start, done[week], log) ---------- */

let yT=null;

    if(!yUnlocked(st)){toast(`Stufe ${st} ist noch gesperrt`);return false}
    const c=yCur();if(kind==="plan"&&(c.complete||c.wait||week!==c.week)){toast(c.wait?"Diese Woche ist Yoga schon erledigt":"Diese Woche ist noch nicht dran");return false}

  else if(kind==="post"){day=opt.day||null;items=yPost(day).items;title="Dehnen nach dem Training"}
  else{kind="quick";items=yQuick().items;title="Schnell-Dehnen"}

function fxStop(){if(FX.raf)cancelAnimationFrame(FX.raf);FX.raf=0;clearTimeout(FX.tm);FX.tm=0}

function fxNew(k,w,h,born){const r=Math.random;
  if(k==="ironman")return{x:r()*w,y:h+4-(born?r()*h*.5:0),vx:(r()-.5)*50,vy:-(110+r()*150),l:0,L:1.4+r()*1.8,s:.8+r()*1.2,c:r()<.5?"255,200,90":"255,110,50"};

  return{x:r()*w,y:born?r()*h:-8,vy:12+r()*22,ph:r()*6.3,s:2.5+r()*3.5,a:r()*6.3,va:(r()-.5)*.8}}
function fxFrame(now){FX.raf=0;if(!FX.k)return;const c=FX.c,x=FX.x;

    if(k==="ironman"){q.l+=dt;q.vy+=55*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;const a=Math.max(0,1-q.l/q.L);x.strokeStyle=`rgba(${q.c},${(.85*a).toFixed(3)})`;x.lineWidth=q.s;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-q.vx*.06,q.y-q.vy*.06);x.stroke();if(q.l>q.L||q.y>h+10)P[i]=fxNew(k,w,h)}

    else if(k==="cyber"){q.x+=q.v*dt;const g=x.createLinearGradient(q.x,0,q.x+q.len,0);g.addColorStop(0,`rgba(${q.c},0)`);g.addColorStop(1,`rgba(${q.c},.55)`);x.strokeStyle=g;x.lineWidth=1.2;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x+q.len,q.y);x.stroke();if(q.x>w)P[i]=fxNew(k,w,h)}

  const H=fxHoles(now,h);x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.6)";for(const r of H)x.fillRect(r[0]-16,r[1]-16,r[2]+32,r[3]+32);
