<title>Homegym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
/* Layout: one-column phone app with HUD panels (corner brackets, glass), bottom tab bar, full-screen training overlays.
   Look: arc-reactor cyan for interface light, suit red-to-gold for the main action, bumper-plate colors as data colors. */
:root{
  --bg:#03060b; --panel:rgba(9,20,32,.74); --panel2:rgba(14,32,48,.9);
  --line:rgba(80,200,255,.15); --line2:rgba(80,200,255,.34);
  --fg:#e6f6ff; --muted:#7ea3b8; --faint:#466476; --label:#7fb3c6;
  --arc:#3ee6ff; --arc2:#0b9fd6; --red:#e0322b; --gold:#f5b72e;
  --accent:#3ee6ff; --accent-ink:#021018; --good:#3ee6a0; --warn:#f5b72e;
  --surface:rgba(9,20,32,.74); --surface2:#0c1a28;
  --p25:#e0322b; --p20:#2f6be0; --p15:#f2bd2c; --p10:#2fb36a; --p5:#e8eef2; --p2:#7f95a3;
  --display:"Rajdhani","Arial Narrow",sans-serif;
  --hud:"Orbitron","Rajdhani",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overscroll-behavior:none;
  background:radial-gradient(900px 520px at 0% -8%,rgba(62,230,255,.09),transparent 62%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(62,230,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(62,230,255,.045) 1px,transparent 1px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.02;text-transform:uppercase}
h1{text-shadow:none}
.num{font-family:var(--hud);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.label{font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--label);font-weight:600}
.muted{color:var(--muted)}
#app{display:flex;flex-direction:column;min-height:100%;position:relative;z-index:1}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 18px) 110px;max-width:640px;width:100%;margin:0 auto}
section{display:flex;flex-direction:column;gap:16px}

/* HUD panel with corner brackets */
.card,.stage,.stepper,.libitem,.histitem,details.tip,.empty,.hint{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 0 28px rgba(62,230,255,.035)}
.card::before,.stage::before,.stepper::before,.libitem::before,.histitem::before,details.tip::before{content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:var(--r);opacity:.5;
  background:linear-gradient(var(--arc),var(--arc)) top left/14px 2px no-repeat,linear-gradient(var(--arc),var(--arc)) top left/2px 14px no-repeat,
  linear-gradient(var(--arc),var(--arc)) bottom right/14px 2px no-repeat,linear-gradient(var(--arc),var(--arc)) bottom right/2px 14px no-repeat}
.card{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(3,7,12,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line2);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--arc)}
.tabs button[aria-current="page"] svg{filter:drop-shadow(0 0 6px var(--arc))}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:2px;background:var(--arc);box-shadow:0 0 10px var(--arc)}

.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;padding:12px 16px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;background:rgba(62,230,255,.07);border:1px solid var(--line2);min-height:48px;color:var(--fg)}
.btn.primary{position:relative;border:0;border-radius:0;color:#02141c;font-size:20px;letter-spacing:.18em;
  background:linear-gradient(180deg,#7befff,#2cc6ea);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 45%);pointer-events:none}
.btn:disabled{opacity:.35;filter:grayscale(.6);cursor:not-allowed}
#onb{z-index:50}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:7px 12px;font-size:13px;letter-spacing:.1em}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:5px 12px;border:1px solid var(--line2);font-family:var(--hud);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--accent-ink);border-color:var(--fg)}
.hello h1{font-size:36px}
.plan-letter{font-family:var(--hud);font-weight:800;font-size:58px;line-height:.85;color:var(--fg);text-shadow:0 0 18px rgba(62,230,255,.35)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.exlist li:first-child{border-top:0}
.exlist li>span:first-child::before{content:"";display:inline-block;width:5px;height:5px;background:var(--arc);margin-right:10px;vertical-align:middle;transform:rotate(45deg);opacity:.7}
.sr{font-family:var(--hud);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:.08em}
.week i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:13px}
.week i.on{background:var(--arc);border-color:var(--arc);color:var(--accent-ink)}
.week i.today{border-color:var(--fg)}
.libitem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:8px;text-align:left;width:100%}
.libitem canvas{width:72px;height:72px;background:radial-gradient(circle at 50% 70%,rgba(62,230,255,.14),transparent 70%),#050c14;border-radius:4px;border:1px solid var(--line)}
.libitem b{display:block;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.libitem small{color:var(--muted)}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:3px 8px;border-radius:3px;border:1px solid var(--line2);color:var(--label)}
details.tip{padding:0 16px}
details.tip summary{list-style:none;padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";font-family:var(--hud);font-size:20px;color:var(--arc)}
details.tip[open] summary::after{content:"–"}
details.tip>div{padding-bottom:16px;color:var(--muted);max-width:62ch}
details.tip div p{margin:0 0 8px}
details.tip strong{color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px}
select,input[type=number],input[type=text],textarea{background:rgba(62,230,255,.05);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;font:inherit;width:100%}
select option{background:#06111b}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.seg{display:flex;border:1px solid var(--line2);border-radius:4px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:2px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--accent-ink)}
.platecount{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.platecount label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;overflow-y:auto;
  background:radial-gradient(700px 420px at 50% -10%,rgba(62,230,255,.09),transparent 65%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.overlay>.inner{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:4px;border:1px solid var(--line2);background:rgba(62,230,255,.05);display:grid;place-items:center;color:var(--arc);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.progress{height:3px;background:rgba(62,230,255,.12);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--arc2),var(--arc));box-shadow:0 0 10px var(--arc);transition:width .4s}
.stage{overflow:hidden;background:radial-gradient(ellipse at 50% 88%,rgba(62,230,255,.16),transparent 60%),linear-gradient(rgba(62,230,255,.05) 1px,transparent 1px) 0 0/100% 22px,#040b13}
.stage canvas{display:block;width:100%;height:250px;position:relative}
.stage .phase{position:absolute;left:14px;top:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--arc);text-shadow:0 0 10px rgba(62,230,255,.6);z-index:1}
.stage .phase:not(:empty)::before{content:"▸ "}
.stage .tempo{position:absolute;right:14px;top:12px;font-family:var(--hud);font-size:10.5px;letter-spacing:.08em;color:var(--muted);z-index:1}
.stage .readout{position:absolute;left:14px;bottom:9px;font-family:var(--hud);font-size:9.5px;letter-spacing:.14em;color:var(--faint);z-index:1}
.exname{font-size:34px}
.setchips{display:flex;gap:8px;flex-wrap:wrap}
.setchip{min-width:66px;padding:7px 10px;border-radius:3px;border:1px solid var(--line);background:rgba(62,230,255,.03);text-align:center;font-family:var(--hud);font-size:13px;font-weight:600;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.setchip small{display:block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.setchip.done{background:rgba(62,230,255,.12);border-color:rgba(62,230,255,.6);color:var(--fg)}
.setchip.cur{border-color:var(--fg);color:var(--fg)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper .ctl{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;width:100%}
.stepper .ctl button{height:44px;border-radius:3px;border:1px solid var(--line2);color:var(--arc);font-size:24px;font-family:var(--display);font-weight:700}
.stepper .val{font-family:var(--hud);font-weight:700;font-size:30px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.hint{font-size:13.5px;color:var(--muted);padding:10px 12px;border-left:2px solid var(--arc)}
.hint b{color:var(--fg)}
.hint.up{border-left-color:var(--fg);background:linear-gradient(90deg,rgba(62,230,255,.08),var(--panel) 60%)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cues li::marker{color:var(--arc);font-family:var(--hud);font-size:12px}
.cues.bad li::marker{content:"✕  ";color:#d9776b}

/* rest: arc reactor */
.restwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.ring::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(62,230,255,.22),rgba(62,230,255,.04) 60%,transparent 72%)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hud);font-size:clamp(46px,15vw,68px);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(62,230,255,.6)}
.ring circle{fill:none}
.ring .bgc{stroke:rgba(62,230,255,.12);stroke-width:10}
.ring .fgc{stroke:var(--arc);stroke-width:10;stroke-linecap:butt;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 8px var(--arc))}
.ring .ticks{stroke:rgba(62,230,255,.45);stroke-width:6;transform-origin:100px 100px;animation:spin 24s linear infinite}
.ring .inner{stroke:rgba(62,230,255,.3);stroke-width:1.5;stroke-dasharray:30 8}
.ring .inner2{stroke:rgba(62,230,255,.3);stroke-width:1;transform-origin:100px 100px;animation:spin 9s linear infinite reverse;stroke-dasharray:60 200}
@keyframes spin{to{transform:rotate(360deg)}}
.restbtns{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;width:100%;max-width:420px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,4,8,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:linear-gradient(180deg,#0a1825,#050c14);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-top:1px solid var(--arc);box-shadow:0 -12px 40px rgba(62,230,255,.15);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.platebar{display:flex;align-items:center;gap:3px;min-height:110px;overflow-x:auto;padding:6px 0}
.platebar .sleeve{height:12px;width:30px;background:linear-gradient(180deg,#c8d6df,#6d8392);border-radius:2px}
.platebar .pl{border-radius:4px;display:grid;place-items:center;font-family:var(--hud);font-weight:700;font-size:11px;color:#071018;writing-mode:vertical-rl;flex:none;box-shadow:0 0 12px rgba(255,255,255,.12)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .num{font-size:22px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.histitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;text-align:left;width:100%}
.histitem .badge{font-family:var(--hud);font-size:18px;font-weight:800;color:var(--fg);min-width:44px;text-align:center}
.chartbox canvas{width:100%;height:180px;display:block}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--arc);color:var(--accent-ink);padding:10px 18px;border-radius:3px;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;z-index:60;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 20px rgba(62,230,255,.5)}
.pbar{height:8px;background:rgba(62,230,255,.1);border-radius:2px;overflow:hidden}.pbar span{display:block;height:100%;background:var(--arc);transition:width .35s}
.food{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.food button{text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;font-size:14px}.food button b{display:block;font-family:var(--hud);font-size:13px;color:var(--arc);margin-top:2px}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.rec:first-of-type{border-top:0}
.banner{border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:var(--muted)}.banner b{color:var(--fg)}
.donecheck{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;border:2px solid var(--arc);box-shadow:0 0 30px rgba(62,230,255,.5),inset 0 0 30px rgba(62,230,255,.3);font-size:48px;color:var(--arc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gear{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.geartile{text-align:left;padding:10px 26px 10px 12px;border:1px solid var(--line2);border-radius:4px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.geartile b{font-family:var(--display);font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:14px;line-height:1.15;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.geartile small{color:var(--muted);font-size:12px;line-height:1.3}
.geartile[aria-pressed="true"]{border-color:var(--arc);background:rgba(62,230,255,.1)}
.geartile[aria-pressed="true"]::after{content:"✓";position:absolute;right:8px;top:6px;color:var(--arc);font-family:var(--hud);font-size:12px}
.libitem.off{opacity:.45}

#pipView{display:none}
body.pip #app,body.pip #train,body.pip #rest,body.pip #sheetBg,body.pip #toast,body.pip #onb{display:none!important}
body.pip #pipView{display:flex;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;background:var(--bg);color:var(--fg);z-index:100}
#pipView .pipL{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--arc)}
#pipView .pipRing{position:relative;width:min(70vw,60vh);aspect-ratio:1}
#pipView .pipRing svg{width:100%;height:100%;transform:rotate(-90deg)}
#pipView .pipRing circle{fill:none;stroke-width:8}
#pipView .pb{stroke:rgba(62,230,255,.15)}
#pipView .pf{stroke:var(--arc);filter:drop-shadow(0 0 4px var(--arc))}
#pipView .pipRing .pipT{position:absolute;inset:0;display:grid;place-items:center}
#pipView .pipT{font-family:var(--hud);font-weight:700;font-size:clamp(20px,16vw,44px);font-variant-numeric:tabular-nums;line-height:1}
#pipView .pipK{font-size:clamp(18px,13vw,36px)}
#pipView .pipS{font-family:var(--display);font-weight:700;font-size:clamp(12px,8vw,18px);text-transform:uppercase;letter-spacing:.04em;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pipView .pipS2{font-family:var(--hud);font-size:clamp(9px,5vw,12px);color:var(--muted)}
</style>

<div id="app">
  <main>
    <section id="v-home"></section>
    <section id="v-lib" hidden></section>
    <section id="v-hist" hidden></section>
    <section id="v-tips" hidden></section>
    <section id="v-set" hidden></section>
  </main>
  <nav class="tabs" aria-label="Bereiche">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Heute</button>
    <button data-tab="lib"><svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>Übungen</button>

function estMin(plan,quick,week){let s=quick?330:480;for(const it of planItems(plan,quick,week)){if(it.fin)continue;const e=EX[it.ex];const work=e.type==="time"?it.hi+10:(e.uni?75:40);s+=it.sets*work+(it.sets)*restOf(it)}return Math.round(s/60/5)*5}
function repLabel(it){const e=EX[it.ex];const r=it.lo===it.hi?it.lo:it.lo+"–"+it.hi;return e.type==="time"?r+" s":r+(e.uni?" je S.":"")}
function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function vib(ms){if(!S.settings.vib)return;if(typeof nativeBg==="function"&&nativeBg())return;try{if(window.Android&&Android.vibrate){Android.vibrate(ms);return}}catch(e){}try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(f=880,d=.12,v=.25){if(!S.settings.sound)return;if(typeof nativeBg==="function"&&nativeBg())return;if(typeof JAI!=="undefined"&&JAI.speaking)v*=.45;const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}

function lastFor(ex){for(let i=S.history.length-1;i>=0;i--){const h=S.history[i];const l=h.log.find(x=>x.ex===ex&&x.sets.some(s=>s.done));if(l)return{h,l}}return null}
function suggest(item){const r=suggestBase(item);if(S.settings.deload&&r.w>0){const e=EX[item.ex];const st=e.type==="bar"?2.5:1;return{...r,w:Math.max(e.type==="bar"?20:0,Math.round(r.w*.6/st)*st),up:false,why:"<b>Entlastungswoche:</b> etwa 60 % vom Gewicht, sauber und locker. Nächste Woche geht's wieder normal weiter."}}return r}
function lastLine(it){const l=lastFor(it.ex);if(!l)return"";const e=EX[it.ex];const d=new Date(l.h.date);
  return`<div class="muted" style="font-size:13px">Letztes Mal (${d.toLocaleDateString("de-DE",{day:"numeric",month:"short"})}): <span class="num" style="font-size:12.5px;color:var(--fg)">${l.l.sets.filter(x=>x.done).map(x=>(+x.w?fmtKg(x.w)+"×":"")+x.r+(e.type==="time"?"s":"")).join(" · ")}</span></div>`}
function suggestBase(item){const e=EX[item.ex];const last=lastFor(item.ex);if(!last)return{w:null,why:null};
  const done=last.l.sets.filter(s=>s.done);const w=Math.max(...done.map(s=>+s.w||0));
  const allTop=done.length>=item.sets&&done.every(s=>+s.r>=item.hi);
  if(allTop&&e.inc>0)return{w:w+e.inc,up:true,why:`Letztes Mal alle Sätze mit ${item.hi} geschafft. Heute <b>+${fmtKg(e.inc)} kg</b>.`,last:done};
  if(allTop)return{w,up:true,why:`Letztes Mal alles geschafft. Nimm ein stärkeres Band oder mach die Bewegung langsamer.`,last:done};
  return{w,why:`Gleiches Gewicht wie letztes Mal. Ziel: <b>mehr Wiederholungen</b> als ${done.map(s=>s.r).join(" / ")}.`,last:done}}

const L={sh:46,th:46,to:58,ne:8,hd:10,ua:31,fa:29};
const rad=a=>a*Math.PI/180;
const V=(a,l)=>[Math.cos(rad(a))*l,Math.sin(rad(a))*l];
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]],sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
function ik(sh,target,bend){const d=sub(target,sh);let dist=Math.hypot(d[0],d[1]);const mx=L.ua+L.fa-.5;const a=Math.atan2(d[1],d[0]);dist=Math.min(Math.max(dist,Math.abs(L.ua-L.fa)+.5),mx);
  const c=(L.ua*L.ua+dist*dist-L.fa*L.fa)/(2*L.ua*dist);const th=Math.acos(Math.max(-1,Math.min(1,c)));const ea=a+bend*th;
  const elbow=[sh[0]+Math.cos(ea)*L.ua,sh[1]+Math.sin(ea)*L.ua];const hand=[sh[0]+Math.cos(a)*dist,sh[1]+Math.sin(a)*dist];return[elbow,hand]}
function legsFrom(hip,th,sn){const k=add(hip,V(th,L.th));return[k,add(k,V(sn,L.sh))]}
function solve(p){
  const o={};let hip,sh;
  if(p.anchor==="foot"){const ank=p.at||[0,0];const k=sub(ank,V(p.shin,L.sh));hip=sub(k,V(p.thigh,L.th));o.knee=k;o.ankle=ank;sh=add(hip,V(p.torso,L.to))}
  else if(p.anchor==="hip"){hip=p.at||[0,0];sh=add(hip,V(p.torso,L.to))}
  else if(p.anchor==="shoulder"){sh=p.at;hip=sub(sh,V(p.torso,L.to))}
  else if(p.anchor==="hand"){const hand=p.at||[0,0];const el=sub(hand,V(p.fore,L.fa));sh=sub(el,V(p.upper,L.ua));hip=sub(sh,V(p.torso,L.to));o.elbow=el;o.hand=hand}
  {const so=add(V(p.torso,p._scE||0),V(p.torso+90,p._scR||0));if(p.anchor==='hand')hip=sub(hip,so);else if(p.anchor!=='shoulder')sh=add(sh,so)}
  if(!o.knee){const[k,a]=legsFrom(hip,p.thigh,p.shin);o.knee=k;o.ankle=a}
  o.hip=hip;o.sh=sh;
  const armAng=(u,f)=>p.rel?[p.torso+u,p.torso+f]:[u,f];
  if(!o.hand){
    o.back=add(sh,V(p.torso+150,7));
    if(p.handAt){[o.elbow,o.hand]=ik(sh,p.handAt,p.bend||1)}
    else if(p.handTo==="back"){o.hand=add(sh,V(p.torso+158,8));o.elbow=add(sh,V(p.torso+168,21))}
    else if(p.handTo==="hip"){[o.elbow,o.hand]=ik(sh,add(hip,[3,4]),p.bend||1)}
    else if(p.hand){[o.elbow,o.hand]=ik(sh,add(sh,p.hand),p.bend||-1)}
    else{const[u,f]=armAng(p.upper,p.fore);o.elbow=add(sh,V(u,L.ua));o.hand=add(o.elbow,V(f,L.fa))}
  }
  if(p.hand2){[o.elbow2,o.hand2]=ik(sh,add(sh,p.hand2),p.bend2||-1)}
  else if(p.upper2!=null){o.elbow2=add(sh,V(p.upper2,L.ua));o.hand2=add(o.elbow2,V(p.fore2,L.fa))}
  else{o.elbow2=add(o.elbow,[-3,1.5]);o.hand2=add(o.hand,[-3,1.5])}
  if(p.thigh2!=null){const[k,a]=legsFrom(hip,p.thigh2,p.shin2);o.knee2=k;o.ankle2=a}
  else{o.knee2=add(o.knee,[-3,1.5]);o.ankle2=add(o.ankle,[-3,1.5])}
  const ha=p.torso+(p.neck||0);o.neck=add(sh,V(ha,L.ne));o.head=add(sh,V(ha,L.ne+L.hd));
  const fa=p.foot!=null?p.foot:0;o.toe=add(o.ankle,V(fa,11));o.toe2=add(o.ankle2,V(p.foot2!=null?p.foot2:fa,11));
  return o}
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpPose(A,B,t){const o={};for(const k in A){const a=A[k],b=B[k];if(typeof a==="number"&&typeof b==="number")o[k]=lerp(a,b,t);else if(Array.isArray(a)&&Array.isArray(b))o[k]=a.map((v,i)=>lerp(v,b[i],t));else o[k]=a}return o}

function planItems(day,quick,week){week=week||cycleWeek();const d=dayDef(week,day);let it=d.items.map((v,i)=>({ex:v[0],sets:v[1],lo:v[2],hi:v[3],slot:i}));

function repsFor(it,k){if(k===it.ex)return{lo:it.lo,hi:it.hi};const a=EX[it.ex].type,b=EX[k].type;
  if(b==="time")return a==="time"?{lo:it.lo,hi:it.hi}:{lo:30,hi:45};
  if((ISO.includes(SUB[k])||ISOX.has(k))&&!["diamondpush","chairdip","dips"].includes(k))return{lo:10,hi:15};

  return{lo:it.lo,hi:it.hi}}
function adaptItems(day,items){const used=new Set(items.filter(it=>canDo(it.ex)).map(it=>it.ex));const out=[];
  for(const it of items){if(canDo(it.ex)){out.push(it);continue}
    let pick=null;
    if(it.fin){pick=(DAYFIN[day]||DAYFIN.A).find(k=>canDo(k)&&!used.has(k))||null}
    else{const allowed=DAYEX[day]||[];const r0=TRANK[EX[it.ex].type]??3;const key=k=>{const r=TRANK[EX[k].type]??3;return r>=r0?r-r0:10+(r0-r)};
      const pref=(PREFER[it.ex]||[]).find(k=>allowed.includes(k)&&canDo(k)&&!used.has(k));
      let c=allowed.filter(k=>SUB[k]===SUB[it.ex]&&canDo(k)&&!used.has(k)&&AN[animOf(k)]);
      if(it.ex==="facepull")c=allowed.filter(k=>["rear","rowp"].includes(SUB[k])&&canDo(k)&&!used.has(k));

function swapPool(it,day){day=day||(S.session&&S.session.plan)||"A";const isT=k=>EX[k].type==="time";const used=new Set((S.session&&S.session.items||[]).map(x=>x.ex));

    c=it.ex==="facepull"||SUB[it.ex]==="rear"?allowed.filter(k=>["rear","rowp"].includes(SUB[k])&&k!==it.ex):allowed.filter(k=>SUB[k]===sub&&k!=="facepull");
    c=c.filter(k=>!used.has(k)&&k!==it.ex&&allowed.includes(k)&&EX[k]&&AN[animOf(k)]&&isT(k)===isT(it.ex))}

function summary(ss){let sets=0,vol=0;const prs=[];
  for(const l of ss.log){let best=null;for(const s of l.sets)if(s.done){sets++;if(EX[l.ex].type!=="time")vol+=(+s.w||0)*(+s.r||0);if(EX[l.ex].type!=="time"&&+s.w>0&&(!best||e1(s)>e1(best)))best=s}
    if(best){let prev=0;for(const h of S.history)for(const x of h.log)if(x.ex===l.ex)for(const s of x.sets)if(s.done&&+s.w>0)prev=Math.max(prev,e1(s));if(prev>0&&e1(best)>prev+0.01)prs.push({ex:l.ex,w:best.w,r:best.r})}}
  return{sets,vol,prs}}

/* ================= HISTORY ================= */
let chartEx=null;
function renderHist(){const H=S.history.slice().reverse();
  const exWith=Object.keys(EX).filter(k=>EX[k].type!=="time"&&S.history.some(h=>h.log.some(l=>l.ex===k)));
  if(!chartEx||!exWith.includes(chartEx))chartEx=exWith.includes("squat")?"squat":exWith[0];
  $("#v-hist").innerHTML=`<h1 style="font-size:34px">Verlauf</h1>${bodyCard()}${recordsCard()}
  ${H.length?`<div class="card chartbox"><div class="row between"><div class="label">Fortschritt</div><select id="chSel" style="width:auto">${exWith.map(k=>`<option value="${k}" ${k===chartEx?"selected":""}>${esc(EX[k].n)}</option>`).join("")}</select></div><canvas id="chart"></canvas><div class="muted" style="font-size:12.5px" id="chNote"></div></div>
  <div class="label">Einheiten</div>${H.map((h,i)=>{const d=new Date(h.date);const sets=h.log.reduce((a,l)=>a+l.sets.length,0);return`<button class="histitem" data-h="${S.history.length-1-i}"><span class="badge">${h.week||1}${h.plan}</span><span><b>${d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}</b><br><small class="muted">${sets} Sätze · ${Math.max(1,Math.round(h.dur/60))} Min.</small></span><span class="muted">›</span></button>`}).join("")}`
  :`<div class="empty">Noch keine Trainings gespeichert.<br>Nach deiner ersten Einheit siehst du hier deinen Fortschritt.</div>`}`;
  if(H.length){$("#chSel").onchange=e=>{chartEx=e.target.value;drawChart()};drawChart()}
  for(const b of document.querySelectorAll("[data-h]"))b.onclick=()=>openHist(+b.dataset.h);bindBody()}
let bodyDraft=null;
function bodyCard(){if(bodyDraft==null)bodyDraft=bodyKg();const pts=S.body.map(b=>({d:new Date(b.d),v:b.kg}));const first=S.body[0],last=S.body[S.body.length-1];
  const diff=first&&last&&S.body.length>1?Math.round((last.kg-first.kg)*10)/10:null;
  return`<div class="card"><div class="row between"><div class="label">Körpergewicht</div>${diff!=null?`<span class="muted num" style="font-size:12px">${diff>0?"+":""}${fmtKg(diff)} kg seit ${new Date(first.d).toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</span>`:""}</div>
   <div class="row"><div class="stepper" style="flex:1"><div class="ctl"><button data-bw="-1" aria-label="weniger">−</button><span class="val" id="bwVal">${fmtKg(bodyDraft)}</span><button data-bw="1" aria-label="mehr">+</button></div></div><button class="btn" id="bwSave" style="min-height:66px">Heute<br>speichern</button></div>
   ${pts.length>1?`<canvas id="bodyChart" style="width:100%;height:120px;display:block"></canvas>`:""}
   <div class="muted" style="font-size:12.5px">Einmal pro Woche morgens wiegen. Für Muskelaufbau sind etwa +0,25 bis 0,5 kg pro Monat ideal.</div></div>`}
function bindBody(){for(const b of document.querySelectorAll("[data-bw]"))b.onclick=()=>{bodyDraft=Math.round((bodyDraft+.1*(+b.dataset.bw))*10)/10;$("#bwVal").textContent=fmtKg(bodyDraft)};
  $("#bwSave").onclick=()=>{const d=todayKey();const i=S.body.findIndex(b=>b.d===d);if(i>=0)S.body[i].kg=bodyDraft;else S.body.push({d,kg:bodyDraft});save();toast("Gewicht gespeichert");renderHist()};
  const c=$("#bodyChart");if(c)lineChart(c,S.body.map(b=>({d:new Date(b.d),v:b.kg})),1)}
function recordsCard(){const rows=[];for(const k of Object.keys(EX)){let best=null,bd=null;for(const h of S.history)for(const l of h.log)if(l.ex===k)for(const s of l.sets){const sc=EX[k].type==="time"||!(+s.w)?+s.r:e1(s);if(!best||sc>best.sc){best={...s,sc};bd=h.date}}if(best)rows.push({k,best,bd})}
  if(!rows.length)return"";
  return`<div class="card"><div class="label">Bestleistungen</div>${rows.map(r=>{const e=EX[r.k];const v=e.type==="time"?r.best.r+" s":(+r.best.w?fmtKg(r.best.w)+" kg × "+r.best.r:r.best.r+" Wdh.");
    return`<div class="rec"><span>${esc(e.n)}<br><small class="muted">${new Date(r.bd).toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</small></span><span class="num" style="font-size:15px;align-self:center">${v}</span></div>`}).join("")}</div>`}
function lineChart(c,pts,dec){const dpr=devicePixelRatio||1,W=c.clientWidth,Hh=c.clientHeight;c.width=W*dpr;c.height=Hh*dpr;const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,Hh);
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));const pv=Math.max(.5,(hi-lo)*.2);lo-=pv;hi+=pv;const L0=36,R0=10,T0=8,B0=18;
  const X=i=>L0+(W-L0-R0)*i/Math.max(1,pts.length-1),Y=v=>T0+(Hh-T0-B0)*(1-(v-lo)/(hi-lo));const font="11px "+getComputedStyle(document.body).fontFamily;
  x.strokeStyle=CSS["--line"];x.fillStyle=CSS["--faint"];x.font=font;x.textAlign="right";for(let g=0;g<=2;g++){const v=lo+(hi-lo)*g/2;const y=Y(v);x.beginPath();x.moveTo(L0,y);x.lineTo(W-R0,y);x.stroke();x.fillText(v.toFixed(dec),L0-6,y+4)}
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p.v)):x.moveTo(X(i),Y(p.v)));x.strokeStyle=CSS["--accent"];x.lineWidth=2;x.stroke();
  for(let i=0;i<pts.length;i++){x.beginPath();x.arc(X(i),Y(pts[i].v),i===pts.length-1?4:2.5,0,7);x.fillStyle=CSS["--accent"];x.fill()}}
function drawChart(){const c=$("#chart");if(!c||!chartEx)return;const bw=EX[chartEx].type==="bw"||EX[chartEx].type==="band";
  const pts=[];for(const h of S.history){const l=h.log.find(x=>x.ex===chartEx);if(!l||!l.sets.length)continue;
    const v=bw?Math.max(...l.sets.map(s=>+s.r)):Math.max(...l.sets.map(e1));pts.push({d:new Date(h.date),v})}
  $("#chNote").textContent=bw?"Beste Wiederholungszahl pro Einheit":"Geschätztes Maximum für 1 Wiederholung (aus Gewicht × Wiederholungen)";
  const dpr=devicePixelRatio||1,W=c.clientWidth,Hh=c.clientHeight;c.width=W*dpr;c.height=Hh*dpr;const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,Hh);
  if(pts.length<2){x.fillStyle=CSS["--muted"];x.font="14px "+getComputedStyle(document.body).fontFamily;x.textAlign="center";x.fillText(pts.length?"Ab der zweiten Einheit erscheint hier eine Kurve.":"Noch keine Daten",W/2,Hh/2);return}
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));const padv=Math.max(1,(hi-lo)*.15);lo-=padv;hi+=padv;
  const L0=34,R0=10,T0=12,B0=22;const X=i=>L0+(W-L0-R0)*i/(pts.length-1),Y=v=>T0+(Hh-T0-B0)*(1-(v-lo)/(hi-lo));
  x.strokeStyle=CSS["--line"];x.lineWidth=1;x.fillStyle=CSS["--faint"];x.font="11px "+getComputedStyle(document.body).fontFamily;x.textAlign="right";
  for(let g=0;g<=3;g++){const v=lo+(hi-lo)*g/3;const y=Y(v);x.beginPath();x.moveTo(L0,y);x.lineTo(W-R0,y);x.stroke();x.fillText(Math.round(v),L0-6,y+4)}
  x.textAlign="center";x.fillText(pts[0].d.toLocaleDateString("de-DE",{day:"numeric",month:"numeric"}),X(0)+12,Hh-5);x.fillText(pts[pts.length-1].d.toLocaleDateString("de-DE",{day:"numeric",month:"numeric"}),X(pts.length-1)-12,Hh-5);
  const grad=x.createLinearGradient(0,T0,0,Hh-B0);grad.addColorStop(0,CSS["--accent"]+"55");grad.addColorStop(1,CSS["--accent"]+"00");
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p.v)):x.moveTo(X(i),Y(p.v)));x.lineTo(X(pts.length-1),Hh-B0);x.lineTo(X(0),Hh-B0);x.closePath();x.fillStyle=grad;x.fill();
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p.v)):x.moveTo(X(i),Y(p.v)));x.strokeStyle=CSS["--accent"];x.lineWidth=2.5;x.stroke();
  const lp=pts[pts.length-1];x.beginPath();x.arc(X(pts.length-1),Y(lp.v),4.5,0,7);x.fillStyle=CSS["--accent"];x.fill()}
function openHist(i){const h=S.history[i];const d=new Date(h.date);
  openSheet(`<div class="row between"><div><div class="label">Woche ${h.week||1} · Training ${h.plan}</div><h2 style="font-size:26px;margin-top:4px">${d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</h2></div><button class="iconbtn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <div class="muted">Dauer ${Math.max(1,Math.round(h.dur/60))} Min.</div>
   ${h.log.map(l=>`<div><b>${esc(EX[l.ex].n)}</b><div class="muted num" style="font-size:17px">${l.sets.map(s=>(+s.w?fmtKg(s.w)+"×":"")+s.r+(EX[l.ex].type==="time"?"s":"")).join("  ·  ")}</div></div>`).join("")}
   <button class="btn ghost block" id="delH">Diese Einheit löschen</button>`);
  $("#delH").onclick=()=>{closeSheet();confirmSheet("Einheit löschen?","Das lässt sich nicht rückgängig machen.","Löschen",()=>{S.history.splice(i,1);save();renderHist()})}}

function renderTips(){const T=[

  ["Essen für Muskelaufbau",`<p><strong>Eiweiß:</strong> etwa 1,6–2 g pro kg Körpergewicht, bei 70 kg also rund 110–140 g am Tag, verteilt auf 3–4 Mahlzeiten.</p><p><strong>Gute Quellen:</strong> Linsen, Kichererbsen, Eier, Fisch, Hähnchen, Joghurt, Quark, Paneer, Tofu. Ein Dal mit Joghurt oder ein Fisch-Curry mit Reis passt perfekt.</p><p><strong>Kalorien:</strong> leicht mehr essen als du verbrauchst, etwa 200–300 kcal am Tag. Wiegst du dich wöchentlich, sind 0,25–0,5 kg Zunahme pro Monat ein gutes Tempo.</p>`],
  ["Schlaf und Erholung",`<p>Muskeln wachsen in der Pause, nicht beim Training. Ziel: <strong>7–9 Stunden Schlaf</strong>.</p><p>Zwischen zwei Einheiten mindestens ein Ruhetag. Bei 3 Einheiten z. B. Mo · Mi · Fr, bei 2 Einheiten Di · Fr.</p><p><strong>Entlastungswoche:</strong> Alle 6–8 Wochen eine Woche mit etwa 60 % der Gewichte trainieren. Gelenke und Sehnen danken es dir, gerade ab 40.</p>`],
  ["Vitamin D im deutschen Winter",`<p>Von Oktober bis März reicht die Sonne in Deutschland kaum, um Vitamin D zu bilden. Dunklere Haut bildet bei gleicher Sonne weniger Vitamin D. Wer dunklere Haut hat, ist daher häufiger von einem Mangel betroffen.</p><p>Vitamin D ist wichtig für Knochen und Muskeln. Lass den Spiegel beim Hausarzt messen und frag, ob und wie viel du ergänzen solltest.</p>`],
  ["Kreatin",`<p>Kreatin-Monohydrat ist das am besten untersuchte Nahrungsergänzungsmittel für Kraft und Muskelaufbau: <strong>3–5 g täglich</strong>, egal zu welcher Uhrzeit, keine Ladephase nötig. Wenn du Nierenprobleme hast, vorher ärztlich abklären.</p>`],
  ["Sicherheit im Rack",`<p><strong>Sicherheitsablagen</strong> immer einstellen: bei Kniebeuge knapp unter dem tiefsten Punkt, beim Bankdrücken auf Brusthöhe.</p><p><strong>Klemmen</strong> immer auf die Stange. Scheiben gleichmäßig auf beiden Seiten auf- und abladen.</p><p>Wenn eine Wiederholung nicht hochgeht: Stange kontrolliert auf die Ablagen legen. Darum trainierst du im Rack.</p>`],
  ["Technik verbessern",`<p>Film dich ab und zu von der Seite mit dem Handy und vergleich es mit der Animation. Achte auf Rücken, Kniestellung und Bewegungstiefe.</p><p>Neue Übung oder unsicher? Lieber eine Woche mit leichtem Gewicht nur die Bewegung üben.</p>`],
  ["Ausdauer und Boxsack",`<p>Herz und Kreislauf profitieren von 1–2 lockeren Einheiten pro Woche: 20–30 Min. Crosstrainer oder Laufband an trainingsfreien Tagen. Das bremst den Muskelaufbau nicht.</p><p>Als Abschluss nach dem Krafttraining: <strong>3 Runden à 1 Min. Boxsack</strong>, 1 Min. Pause. Gut für Kondition und Kopf.</p>`]];
  $("#v-tips").innerHTML=`<h1 style="font-size:34px">Tipps</h1>${T.map((t,i)=>`<details class="tip" ${i===0?"open":""}><summary>${t[0]}</summary><div>${t[1]}</div></details>`).join("")}
   <div class="card"><div class="label">Deine Ausstattung</div>${myGear().length?`<ul class="cues" style="color:var(--muted)">${GEAR.filter(g=>hasGear(g.id)).map(g=>`<li>${esc(g.l)}</li>`).join("")}</ul>`:`<p class="muted" style="margin:0">Keine Geräte ausgewählt. Die App nutzt Übungen mit Körpergewicht.</p>`}<span class="muted" style="font-size:12.5px">Ändern unter Einstellungen → Meine Ausstattung.</span></div>

  <p class="muted" style="font-size:12px;text-align:center;margin:0">Homegym · Version 2.0</p>`;
  bindGear("s",gearDraft);
  $("#gearSave").onclick=()=>{S.profile={...(S.profile||{}),gear:[...gearDraft],gearV:2,preset:gearDraft._picked||presetOf(gearDraft)};save();toast("Ausstattung gespeichert");renderSet()};
  for(const b of document.querySelectorAll("[data-goal]"))b.onclick=()=>{st.goal=+b.dataset.goal;save();renderSet()};
  for(const b of document.querySelectorAll("[data-rf]"))b.onclick=()=>{st.restF=+b.dataset.rf;save();renderSet()};
  for(const b of document.querySelectorAll("[data-fig]"))b.onclick=()=>{st.fig=b.dataset.fig;save();renderSet()};
  for(const b of document.querySelectorAll("[data-bar]"))b.onclick=()=>{st.bar=+b.dataset.bar;save();renderSet()};
  $("#tSound").onclick=()=>{st.sound=!st.sound;save();renderSet()};$("#tVib").onclick=()=>{st.vib=!st.vib;save();renderSet()};
  for(const b of document.querySelectorAll("[data-cw]"))b.onclick=()=>{S.cycleStart=weekStart(new Date()).getTime()-(+b.dataset.cw-1)*WEEKMS;S.pick=null;save();renderSet();toast("Jetzt Woche "+b.dataset.cw)};
  for(const b of document.querySelectorAll("[data-pip]"))b.onclick=()=>{st.pip=b.dataset.pip==="1";save();renderSet();nativeState(true)};
  for(const b of document.querySelectorAll("[data-ntf]"))b.onclick=()=>{st.notif=b.dataset.ntf==="1";save();renderSet();nativeState(true)};
  for(const b of document.querySelectorAll("[data-vm]"))b.onclick=()=>{st.voiceMode=b.dataset.vm;st.voice=b.dataset.vm!=="off";save();renderSet()};
  $("#jaiTest").onclick=()=>{audio();if(!jaiOn()){toast("Wähle zuerst JAI");return}jaiPlay([jaiGreet(),"plan_b","ex_squat",...jaiNum(4),"u_saetze",...jaiRange(6,8),"u_wiederholungen",...jaiKg(62.5)],{pling:true})};
  for(const b of document.querySelectorAll("[data-deload]"))b.onclick=()=>{st.deload=b.dataset.deload==="1";save();renderSet()};
  $("#testSig").onclick=()=>{audio();beep(660,.1);setTimeout(()=>beep(660,.1),400);setTimeout(()=>{beep(990,.45);vib(500)},800)};
  for(const i of document.querySelectorAll("[data-pc]"))i.onchange=()=>{st.plates[i.dataset.pc]=Math.max(0,Math.min(10,parseInt(i.value)||0));save()};
  $("#profForm").onsubmit=e=>{e.preventDefault();const n=$("#profName").value.trim().slice(0,24);if(!n){toast("Bitte einen Namen eingeben");return}S.profile={...(S.profile||{}),name:n};save();toast("Name gespeichert")};
  $("#bkOut").onclick=async()=>{const t=JSON.stringify({v:4,history:S.history,settings:S.settings,cycleStart:cycStart(),body:S.body,profile:S.profile||null});const ta=$("#bk");ta.value=t;
    try{await navigator.clipboard.writeText(t);toast("Sicherung kopiert")}catch(e){ta.focus();ta.select();try{document.execCommand("copy");toast("Sicherung kopiert")}catch(_){toast("Text markiert, bitte kopieren")}}};
  $("#bkIn").onclick=()=>{try{const d=JSON.parse($("#bk").value);if(!Array.isArray(d.history))throw 0;confirmSheet("Sicherung wiederherstellen?",`${d.history.length} Einheiten werden geladen. Die aktuellen Daten werden ersetzt.`,"Wiederherstellen",()=>{S.history=d.history;S.settings=Object.assign({},DEF.settings,d.settings||{});S.next=d.next||0;if(Array.isArray(d.body))S.body=d.body;if(d.cycleStart)S.cycleStart=d.cycleStart;if(d.profile&&d.profile.name){S.profile=d.profile;if(!Array.isArray(S.profile.gear))S.profile.gear=[...ALLGEAR]}save();toast("Wiederhergestellt");renderSet()})}catch(e){toast("Das ist keine gültige Sicherung")}};
  $("#reset").onclick=()=>confirmSheet("Alle Daten löschen?","Verlauf, Einstellungen und laufendes Training werden gelöscht.","Alles löschen",()=>{try{localStorage.removeItem(KEY)}catch(e){}S=JSON.parse(JSON.stringify(DEF));S.protein={d:"",g:0,log:[]};S.body=[];S.history=[];S.session=null;delete S.profile;delete S.cycleStart;save();go("home");openOnboarding()})}

function userName(){return(S.profile&&S.profile.name)||"Sportler"}
function openOnboarding(){let kg=S.body&&S.body.length?S.body[S.body.length-1].kg:75;let goal=S.settings.goal||3;let fig=S.settings.fig||"mix";
  const segs=()=>{for(const b of document.querySelectorAll("[data-ogoal]"))b.setAttribute("aria-pressed",+b.dataset.ogoal===goal);for(const b of document.querySelectorAll("[data-ofig]"))b.setAttribute("aria-pressed",b.dataset.ofig===fig)};
  $("#onbInner").innerHTML=`<form id="onbForm" style="display:flex;flex-direction:column;gap:16px;flex:1">
   <div style="padding-top:18px"><div class="label">Willkommen · Schritt 1 von 2</div><h1 style="font-size:40px;margin-top:6px">Dein Homegym</h1><p class="muted" style="margin:8px 0 0;max-width:36ch">Trainingsplan, Pausen-Timer und animierte Übungen. Erst ein paar Angaben, dann geht's los.</p></div>
   <div class="card"><label class="field" for="onbName"><span class="label">Wie heißt du?</span><input type="text" id="onbName" maxlength="24" autocomplete="given-name" placeholder="Vorname" required style="font-size:18px;padding:12px"></label></div>
   <div class="card"><span class="label">Körpergewicht</span><div class="stepper" style="border:0;box-shadow:none;padding:0;background:none"><div class="ctl"><button type="button" id="onbM" aria-label="weniger">−</button><span class="val" id="onbKg">${fmtKg(kg)}</span><button type="button" id="onbP" aria-label="mehr">+</button></div></div><span class="muted" style="font-size:12.5px;text-align:center">kg · daraus berechnet die App dein Eiweiß-Ziel</span></div>
   <div class="card"><div class="field"><span class="label">Trainings pro Woche</span><div class="seg">${[2,3].map(n=>`<button type="button" data-ogoal="${n}">${n}× pro Woche</button>`).join("")}</div></div>
    <div class="field"><span class="label">Animierte Figur</span><div class="seg">${[["mix","Abwechselnd"],["m","Mann"],["f","Frau"]].map(([v,l])=>`<button type="button" data-ofig="${v}">${l}</button>`).join("")}</div></div></div>
   <button class="btn primary block" type="submit" id="onbGo" disabled style="margin-top:auto">Weiter</button></form>`;
  $("#onb").hidden=false;segs();
  const nm=$("#onbName"),go_=$("#onbGo");const upd=()=>{go_.disabled=!nm.value.trim()};nm.oninput=upd;upd();
  $("#onbM").onclick=()=>{kg=Math.max(30,Math.round((kg-.5)*10)/10);$("#onbKg").textContent=fmtKg(kg)};$("#onbP").onclick=()=>{kg=Math.min(250,Math.round((kg+.5)*10)/10);$("#onbKg").textContent=fmtKg(kg)};
  for(const b of document.querySelectorAll("[data-ogoal]"))b.onclick=()=>{goal=+b.dataset.ogoal;segs()};
  for(const b of document.querySelectorAll("[data-ofig]"))b.onclick=()=>{fig=b.dataset.ofig;segs()};
  $("#onbForm").onsubmit=e=>{e.preventDefault();const n=nm.value.trim().slice(0,24);if(!n)return;onbGear({n,kg,goal,fig})}}
function onbGear(a){const isJ=/^(joschy|yoshi)$/i.test(a.n);const sel=isJ?[...JOSCHYGEAR]:(S.profile&&Array.isArray(S.profile.gear)?[...S.profile.gear]:[]);sel._picked=isJ?"joschy":null;
  $("#onbInner").innerHTML=`<form id="onbGearForm" style="display:flex;flex-direction:column;gap:16px;flex:1">
   <div style="padding-top:18px"><div class="label">Schritt 2 von 2</div><h1 style="font-size:36px;margin-top:6px">Was hast du zu Hause?</h1><p class="muted" style="margin:8px 0 0;max-width:38ch">Tippe alles an, was du hast. Die App passt die Trainings automatisch an. Matte und Körpergewicht gehen immer.</p></div>
   <div class="card">${gearTiles(sel,"o")}<span class="muted" id="onbGearInfo" style="font-size:12.5px"></span></div>
   <div class="row" style="margin-top:auto"><button type="button" class="btn ghost" id="onbBack">Zurück</button><button class="btn primary" type="submit" id="onbFin" style="flex:1">Fertig</button></div></form>`;
  $("#onb").scrollTop=0;
  const info=()=>{const el=$("#onbGearInfo");if(el)el.textContent=sel.length?sel.length+" von "+GEAR.length+" Geräten ausgewählt":"Keine Geräte · Training nur mit Körpergewicht"};
  bindGear("o",sel,info);
  $("#onbBack").onclick=()=>{openOnboarding();const nmi=$("#onbName");if(nmi){nmi.value=a.n;nmi.dispatchEvent(new Event("input"))}};
  $("#onbGearForm").onsubmit=e=>{e.preventDefault();S.profile={...(S.profile||{}),name:a.n,gear:[...sel],gearV:2,preset:sel._picked||presetOf(sel)};S.settings.goal=a.goal;S.settings.fig=a.fig;
    S.body=S.body||[];const d=todayKey();if(!S.body.some(b=>b.d===d))S.body.push({d,kg:a.kg});save();$("#onb").hidden=true;go("home");toast("Hallo, "+a.n+"!")}}
const RENDER={home:renderHome,lib:renderLib,hist:renderHist,tips:renderTips,set:renderSet};

/* ================= ANDROID BACK ================= */
window.appBack=function(){
  if(!$("#onb").hidden)return;
  if(!$("#sheetBg").hidden){closeSheet();return}
  if(!$("#rest").hidden){return}
  if(!$("#train").hidden){askPause();return}
  if(TAB!=="home"){go("home");return}
  try{window.Android&&Android.exit()}catch(e){}
};

/* ================= MOTION TUNING (natural movement) =================
   path: bar/hand stays over mid-foot · K/K2: keyframes for the way down/up · fix2/fixFeet/plantToe: planted feet · dv: rep-to-rep depth variation · spine: [lumbar, thoracic] curve */
const MOTION={
  squat:{path:{pt:"back",via:"torso",dx:4},dv:1,K:[{t:.14,thigh:-82,shin:-94}],spine:[1.3,-.7]},
  frontsquat:{path:{pt:"hand",via:"torso",dx:5},dv:1,K:[{t:.14,thigh:-84,shin:-95}],spine:[1.1,-.5]},
  goblet:{path:{pt:"hand",via:"torso",dx:7},dv:1,K:[{t:.14,thigh:-84,shin:-95}],spine:[1.1,-.6]},
  goodmorning:{B:{torso:42,shin:-96},path:{pt:"back",via:"thigh",dx:4},K:[{t:.25,shin:-95,torso:76}],spine:[.9,-.5]},
  deadlift:{A:{shin:-96,thigh:-13.2,torso:25.9},path:{pt:"hand",via:"torso",dx:7},eq:[{t:"plate",at:"hand",c:"--p25",r:25.4}],K:[{t:.42,shin:-92,thigh:-48}],K2:[{t:.55,shin:-91,thigh:-60}],spine:[.8,-.5]},
  rdl:{A:{torso:88},B:{torso:44,shin:-94},path:{pt:"hand",via:"thigh",dx:12},K:[{t:.25,shin:-96,torso:77}],spine:[.9,-.5]},
  rdlbb:{A:{torso:88},B:{torso:44,shin:-94},path:{pt:"hand",via:"thigh",dx:12},K:[{t:.25,shin:-96,torso:77}],spine:[.9,-.5]},
  row:{A:{shin:-100,thigh:-42,torso:38,hand:[-8,-56]},B:{shin:-100,thigh:-42,torso:38,hand:[-26,-28]},path:{pt:"hand",via:"hand",dx:7},spine:[.7,-.4]},
  ohp:{A:{neck:0,hand:[10,1],torso:92},B:{neck:5,hand:[1,59],torso:89},K:[{t:.22,neck:-12,hand:[9.5,14]},{t:.5,neck:-5,hand:[6,34]}],spine:[1.6,-.6]},
  bench:{A:{hand:[0,59.3]},B:{hand:[22,12]},K:[{t:.5,hand:[9,37]}],spine:[3,-.4],eq:[{t:"bench"},{t:"plate",at:"hand",c:"--p20",r:19}]},
  closegrip:{A:{hand:[1,59.3]},B:{hand:[20,12]},K:[{t:.5,hand:[8,37]}],spine:[2.6,-.4]},
  dbbench:{A:{hand:[1,59.3]},B:{hand:[20,10]},K:[{t:.5,hand:[8,36]}],spine:[2.8,-.4]},
  incline:{A:{hand:[3,59.3]},B:{hand:[20,10]},K:[{t:.5,hand:[10,36]}],spine:[2,-.3]},
  pullup:{K:[{t:.13,upper:86,fore:90}],spine:[.9,.5]},
  curl:{K:[{t:.7,upper:-86,fore:30}]},
  bbcurl:{K:[{t:.7,upper:-86,fore:30}]},
  lunge:{fix2:1,dv:1,A:{shin:-97,thigh:-45,torso:86},B:{shin:-100,thigh:-8,torso:84,thigh2:-92,shin2:170,foot2:-125},spine:[1.2,-.8]},
  lungebw:{fix2:1,dv:1,A:{shin:-97,thigh:-45,torso:86},B:{shin:-100,thigh:-8,torso:84,thigh2:-92,shin2:170,foot2:-125},spine:[1.2,-.8]},
  bss:{fix2:1,dv:1,spine:[1.1,-.7]},
  hipthrust:{fixFeet:1,spine:[.6,-.3]},
  glutebridge:{fixFeet:1,spine:[.6,-.3]},
  calf:{plantToe:1},calfbw:{plantToe:1},
  airsquat:{dv:1,K:[{t:.14,thigh:-84,shin:-95}]},
  dips:{spine:[.6,-1.4]},
  kbswing:{spine:[.8,-.4]},
  kbpress:{A:{hand:[10,1],torso:91,neck:0},B:{hand:[1,59],torso:89,neck:4},K:[{t:.25,hand:[9.5,15],neck:-8},{t:.5,hand:[6,34],neck:-3}],spine:[1.4,-.6]},
  ohpdb:{A:{hand:[10,1]},B:{hand:[1,59]},K:[{t:.25,hand:[9.5,15]},{t:.5,hand:[6,34]}]},
  mbslam:{K:[{t:.45,hand:[24,12]}]},
  wallsit:{noBal:1},
  run:{gait:"run",floor:0,hip:87.5},
  jj:{hop:6},
  chairdip:{fixFeet:1,B:{fore:-88,upper:168,torso:88}}
};
for(const k in MOTION){const d=AN[k];if(!d)continue;const m=MOTION[k];for(const f in m){if(f==="A"||f==="B")Object.assign(d[f],m[f]);else d[f]=m[f]}}
/* ================= BOOT ================= */
readCss();
go("home");
if(!(S.profile&&S.profile.name))openOnboarding();
if(S.session&&S.session.restEnd&&S.session.restEnd>Date.now()){openTrain();$("#rest").hidden=false;renderRest()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TAB==="hist")drawChart();if(!document.hidden&&window.appResume)window.appResume()});
nativeState(true);
</script>
